<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Для тех, кто одинок</title>
  <link rel="icon" type="image/png" href="../Images/logo.png">
  <style>
    /* Подключаем NotoSerifJP-Light */
    @font-face {
      font-family: 'NotoSerifJP';
      src: url('../Font/NotoSerifJP-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'Eitai';
      src: url('../Font/Eitai.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1f2024;
      font-family: 'Eitai', sans-serif;
      color: #1f2024;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      
      /* Запрет выделения текста */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* Основной блок — МИНИМАЛЬНОЕ СКРУГЛЕНИЕ */
    .release-container {
      max-width: 500px;
      width: auto;
      text-align: center;
      background-color: #f0fff8;
      padding: 1.2rem 1.2rem;
      border-radius: 8px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
      
      display: flex;
      flex-direction: column;
      align-items: center;
      
      /* Запрет выделения текста */
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    .release-cover {
      width: 280px;
      aspect-ratio: 1 / 1;
      background-color: #1f2024;
      border: 1px solid #700707;
      overflow: hidden;
      margin: 0 auto 1rem auto;
      border-radius: 6px;
      
      /* Запрет перетаскивания */
      pointer-events: none;
    }

    .release-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      
      /* Запрет перетаскивания и сохранения */
      pointer-events: none;
      -webkit-user-drag: none;
      user-drag: none;
    }

    /* Контейнер для текста — ширина как у обложки */
    .text-wrapper {
      width: 280px;
      max-width: 100%;
      text-align: center;
      margin: 0 auto;
    }

    /* Название — РАЗРЕШЕНО ВЫДЕЛЕНИЕ */
    .release-title {
      font-family: 'NotoSerifJP', 'Eitai', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: #1f2024;
      line-height: 1.2;
      margin-bottom: 0.2rem;
      letter-spacing: -0.04em;
      transform: scaleX(0.75);
      display: inline-block;
      white-space: nowrap;
      
      /* РАЗРЕШАЕМ ВЫДЕЛЕНИЕ ТОЛЬКО ДЛЯ НАЗВАНИЯ */
      user-select: text;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      cursor: text;
    }

    /* Дата */
    .release-date {
      font-family: 'NotoSerifJP', 'Eitai', serif;
      font-size: 1rem;
      font-weight: 300;
      color: #1f2024;
      opacity: 0.5;
      letter-spacing: 0.5px;
      margin-bottom: 0.8rem;
      transform: scaleX(0.75);
      display: inline-block;
    }

    /* Логотип — КЛИКАБЕЛЕН */
    .release-logo {
      margin-bottom: 1rem;
    }

    .release-logo a {
      display: inline-block;
      cursor: pointer;
    }

    .release-logo img {
      width: 60px;
      height: auto;
      filter: brightness(0) saturate(100%) invert(11%) sepia(53%) saturate(4321%) hue-rotate(352deg) brightness(95%) contrast(102%);
      
      /* Запрет перетаскивания */
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    /* Заголовок AVAILABLE ON */
    .available-title {
      font-family: 'NotoSerifJP', 'Eitai', serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #1f2024;
      opacity: 0.6;
      letter-spacing: 2px;
      margin-bottom: 0.8rem;
      transform: scaleX(0.75);
      display: inline-block;
      width: 100%;
    }

    /* Разделительная черта */
    .divider-line {
      width: 100%;
      height: 1px;
      background-color: #700707;
      opacity: 0.3;
      margin: 0.8rem 0;
    }

    /* Платформы */
    .platforms-section {
      display: flex;
      flex-direction: column;
      width: 280px;
      max-width: 100%;
      margin: 0 auto;
    }

    .platform-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: stretch;
    }

    .platform-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(31, 32, 36, 0.1);
      padding-bottom: 0.35rem;
      width: 100%;
    }

    /* Контейнер для названия платформы */
    .platform-name-wrapper {
      transform: scaleX(0.75);
      transform-origin: left center;
      display: inline-block;
    }

    .platform-name {
      font-family: 'NotoSerifJP', 'Eitai', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: #1f2024;
      opacity: 0.8;
      letter-spacing: -0.04em;
      display: inline-block;
    }

    /* Квадратный скруглённый бокс для иконки */
    .platform-link {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: 2px solid #1f2024;
      border-radius: 5px;
      background-color: #f0fff8;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .platform-link img {
      width: 20px;
      height: 20px;
      object-fit: contain;
      
      /* Запрет перетаскивания */
      -webkit-user-drag: none;
      user-drag: none;
    }

    .platform-link:hover {
      background-color: #700707;
      border-color: #700707;
    }

    .platform-link:hover img {
      filter: brightness(0) invert(1);
    }

    /* Not Available */
    .not-available {
      text-align: center;
      margin: 0;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .not-available-title {
      font-family: 'NotoSerifJP', 'Eitai', serif;
      font-size: 1.3rem;
      font-weight: 400;
      color: #700707;
      transform: scaleX(0.75);
      display: inline-block;
      white-space: nowrap;
    }

    /* Скрытые элементы */
    .divider, .tracklist-section, .not-available-text {
      display: none;
    }

    /* Мобильная версия */
    @media (max-width: 600px) {
      body {
        padding: 0;
        background-color: #f0fff8;
      }
      
      .release-container {
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
        padding: 1.2rem 1.2rem;
        box-shadow: none;
        width: 100%;
      }
      
      .release-cover {
        width: min(75%, 280px);
        max-width: 280px;
      }
      
      .text-wrapper {
        width: min(75%, 280px);
        max-width: 280px;
      }
      
      .platforms-section {
        width: min(75%, 280px);
        max-width: 280px;
      }
      
      .not-available {
        width: 100%;
      }
      
      .release-title {
        font-size: 1.4rem;
      }
      
      .release-date {
        font-size: 1.1rem;
      }
      
      .release-logo img {
        width: 70px;
      }
      
      .available-title {
        font-size: 1rem;
      }
      
      .platform-name {
        font-size: 1.4rem;
      }
      
      .platform-link {
        width: 36px;
        height: 36px;
      }
      
      .platform-link img {
        width: 22px;
        height: 22px;
      }
      
      .not-available-title {
        font-size: 1.4rem;
        white-space: nowrap;
      }
      
      .divider-line {
        width: min(75%, 280px);
        max-width: 280px;
        margin-left: auto;
        margin-right: auto;
      }
    }

    @media (min-width: 601px) and (max-width: 900px) {
      body {
        background-color: #1f2024;
        padding: 2rem 1.5rem;
      }
    }

    /* Запрет выделения для всех элементов кроме названия */
    h1, div, span, a {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* Запрет перетаскивания для всех изображений */
    img {
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="release-container">
    <!-- Обложка -->
    <div class="release-cover">
      <img src="" alt="" id="releaseCover">
    </div>
    
    <!-- Обёртка для текста с шириной как у обложки -->
    <div class="text-wrapper">
      <!-- Название -->
      <h1 class="release-title" id="releaseTitle"></h1>
      
      <!-- Дата -->
      <div class="release-date" id="releaseDate"></div>
      
      <!-- Логотип с ссылкой -->
      <div class="release-logo">
        <a href="../discography.html">
          <img src="../Images/logo.png" alt="Logo">
        </a>
      </div>
    </div>
    
    <!-- Разделительная черта (показывается только когда нет платформ) -->
    <div class="divider-line" id="dividerLine" style="display: none;"></div>
    
    <!-- Заголовок AVAILABLE ON -->
    <div class="available-title" id="availableTitle">- AVAILABLE ON -</div>
    
    <!-- Платформы -->
    <div class="platforms-section">
      <div class="platform-list" id="platformsList"></div>
      <div class="not-available" id="notAvailable" style="display: none;">
        <div class="not-available-title">NOT AVAILABLE</div>
      </div>
    </div>
    
    <!-- Скрытый треклист -->
    <div class="tracklist-section"></div>
  </div>

  <script>
    // Запрет контекстного меню (правый клик)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });
    
    // Запрет перетаскивания изображений
    document.addEventListener('dragstart', function(e) {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
        return false;
      }
    });
    
    const releaseData = {
      cover: '../Images/Releases/ep_01.png',
      title: 'Для тех, кто одинок',
      date: '2023.03.06',
      platforms: {
        spotify: '',
        appleMusic: '',        
        yandexMusic: '',       
        amazonMusic: '',       
        deezer: '',            
        youtubeMusic: '',      
        boomplay: '',          
        vk: ''                 
      },
      tracks: []
    };
    
    const platformNames = {
      spotify: 'Spotify',
      appleMusic: 'Apple Music',
      yandexMusic: 'Yandex Music',
      amazonMusic: 'Amazon Music',
      deezer: 'Deezer',
      youtubeMusic: 'YouTube Music',
      boomplay: 'Boomplay',
      vk: 'VK'
    };
    
    function renderRelease() {
      document.getElementById('releaseCover').src = releaseData.cover;
      document.getElementById('releaseCover').alt = releaseData.title;
      document.getElementById('releaseTitle').textContent = releaseData.title;
      document.getElementById('releaseDate').textContent = releaseData.date;
      
      const availablePlatforms = [];
      
      for (const [key, url] of Object.entries(releaseData.platforms)) {
        if (url && url.trim() !== '') {
          availablePlatforms.push({
            name: platformNames[key],
            url: url
          });
        }
      }
      
      const platformsList = document.getElementById('platformsList');
      const notAvailable = document.getElementById('notAvailable');
      const availableTitle = document.getElementById('availableTitle');
      const dividerLine = document.getElementById('dividerLine');
      
      if (availablePlatforms.length > 0) {
        platformsList.style.display = 'flex';
        notAvailable.style.display = 'none';
        availableTitle.style.display = 'block';
        dividerLine.style.display = 'none';
        
        platformsList.innerHTML = '';
        availablePlatforms.forEach(platform => {
          const row = document.createElement('div');
          row.className = 'platform-row';
          
          const wrapper = document.createElement('span');
          wrapper.className = 'platform-name-wrapper';
          
          const nameSpan = document.createElement('span');
          nameSpan.className = 'platform-name';
          nameSpan.textContent = platform.name;
          
          wrapper.appendChild(nameSpan);
          
          const link = document.createElement('a');
          link.className = 'platform-link';
          link.href = platform.url;
          link.target = '_blank';
          
          const playIcon = document.createElement('img');
          playIcon.src = '../Images/Hud/play.png';
          playIcon.alt = 'Play';
          
          link.appendChild(playIcon);
          link.setAttribute('aria-label', `Open ${platform.name}`);
          
          row.appendChild(wrapper);
          row.appendChild(link);
          platformsList.appendChild(row);
        });
      } else {
        platformsList.style.display = 'none';
        notAvailable.style.display = 'flex';
        availableTitle.style.display = 'none';
        dividerLine.style.display = 'block';
      }
    }
    
    renderRelease();
  </script>
</body>
</html>
