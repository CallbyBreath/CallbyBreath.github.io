    <style>

        .cursor-trail { position: fixed; pointer-events: none; z-index: 10000; width: 6px; height: 6px; border-radius: 50%; background: rgba(0,255,0,0.6); box-shadow: 0 0 6px rgba(0,255,0,0.4); animation: trailFade 0.6s ease-out forwards; }

        #globalBgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        .left-panel, .right-panel { width: clamp(40px, 5vw, 64px); flex-shrink: 0; height: 100vh; position: relative; z-index: 5; background: #111111; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 10; height: 100%; }

        .top-bar-inner { width: 100%; height: clamp(48px, 8vh, 64px); display: flex; align-items: center; justify-content: space-between; padding: 0; position: relative; }

        .nav { display: flex; gap: 1.2rem; align-items: center; padding-right: 0; }

        .mobile-menu-btn { display: none; background: transparent; border: none; color: #ffffff; font-size: 1.8rem; cursor: pointer; padding: 0 0.5rem 0 0; line-height: 1; transition: color 0.2s, transform 0.3s ease; text-shadow: 0 0 8px rgba(255,255,255,0.6); }

        .shop-item-price { font-family: 'Press Start 2P', sans-serif; font-size: 0.7rem; color: #00ff00; margin-bottom: 0.8rem; text-shadow: 0 0 8px rgba(0,255,0,0.6); }
        .shop-item-controls { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; flex-wrap: wrap; }

        .bottom-bar { width: 100%; padding: 0; flex-shrink: 0; position: relative; z-index: 100; background: #111111; }
        .bottom-bar-inner { width: 100%; height: clamp(48px, 8vh, 64px); display: flex; align-items: center; justify-content: center; padding: 0 1rem; position: relative; gap: 2rem; }
        .bottom-social-link { text-decoration: none; font-family: 'Press Start 2P', sans-serif; font-size: clamp(0.5rem, 0.9vw, 0.65rem); letter-spacing: 0.3px; color: #ffffff; text-transform: uppercase; transition: color 0.2s ease; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        .bottom-social-link:hover { color: #00ff00; text-shadow: 0 0 14px rgba(0,255,0,1); }
        .mobile-social-btn { display: none; background: none; border: none; color: #ffffff; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; padding: 0.5rem 1rem; text-shadow: 0 0 8px rgba(255,255,255,0.6); transition: color 0.2s ease; }
        .mobile-social-btn:hover { color: #00ff00; text-shadow: 0 0 10px rgba(0,255,0,1); }

        @media (max-width: 768px) {
            .left-panel, .right-panel { width: clamp(30px, 6vw, 40px); }
            .nav, .more-toggle { display: none; }
            .mobile-menu-btn { display: block; }
            .page-content { padding: 1rem 0.5rem; }
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
            .product-detail-card, .direct-fullscreen .direct-card { flex-direction: column; align-items: center; padding: 1.5rem; }
            .product-detail-image, .direct-fullscreen .direct-image { width: 70%; max-width: 250px; }
            .bottom-bar-inner { gap: 0; height: clamp(40px, 7vh, 48px); }
            .bottom-social-link { display: none; }
            .mobile-social-btn { display: block; }
            .agreement-box { padding: 2rem; }
            .agreement-box h3 { font-size: 1.5rem; }
            .btn-buy, .btn-get { font-size: 0.65rem; padding: 0.5rem 1.2rem; min-width: 80px; }
            .purchase-input { font-size: 0.65rem; }
            .product-detail-title { font-size: 1.4rem; }
            .include-more-btn { font-size: 0.6rem; padding: 0.4rem 1rem; }
        }
        @media (max-width: 480px) {
            .left-panel, .right-panel { width: clamp(20px, 5vw, 28px); }
            .logo { height: clamp(24px, 4vh, 32px); }
            .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
            .shop-item { padding: 0.5rem; border-radius: 8px; }
            .shop-item-image { margin-bottom: 0.3rem; border-radius: 6px; }
            .shop-item-title { font-size: 0.55rem; margin: 0.3rem 0; }
            .shop-item-price { font-size: 0.55rem; margin-bottom: 0.5rem; }
            .shop-item-controls { gap: 0.3rem; }
            .shop-item-action { font-size: 0.45rem; padding: 0.35rem 0.6rem; border-radius: 6px; }
            .product-detail-card, .direct-fullscreen .direct-card { padding: 0.8rem; gap: 0.8rem; }
            .product-detail-image, .direct-fullscreen .direct-image { width: 80%; max-width: 180px; }
            .btn-buy, .btn-get { font-size: 0.55rem; padding: 0.45rem 0.8rem; min-width: 65px; }
            .purchase-input { font-size: 0.55rem; padding: 0.4rem; width: 100%; }
            .buy-row { flex-wrap: wrap; gap: 0.4rem; }
            .product-detail-title { font-size: 1rem; }
            .include-more-btn { font-size: 0.5rem; padding: 0.3rem 0.7rem; }
            #includeMoreOverlay .include-more-title { font-size: 1.3rem; }
            #includeMoreOverlay .include-full-list li { font-size: 0.55rem; }
            .agreement-box { padding: 1.2rem; }
            .agreement-box h3 { font-size: 1.1rem; }
            .agreement-box p { font-size: 0.55rem; }
        }
    </style>
</head>
<body>
    <canvas id="globalBgCanvas"></canvas>
    <div class="left-panel"></div>
    <div class="main-content" id="mainContent">
        <div class="more-overlay" id="moreOverlay">
            <canvas class="overlay-bg-canvas" id="moreBgCanvas"></canvas>
            <button class="overlay-close-btn" id="closeMoreOverlay">✕</button>
            <div class="more-overlay-title">More</div>
            <div class="more-overlay-list">
                <a href="archive.html"><span>ARCHIVE</span></a>
                <a href="schedule.html"><span>SCHEDULE</span></a>
                <a href="special.html"><span>SPECIAL</span></a>
            </div>
        </div>
        <div class="social-overlay" id="socialOverlay">
            <canvas class="overlay-bg-canvas" id="socialBgCanvas"></canvas>
            <button class="overlay-close-btn" id="closeSocialOverlay">✕</button>
            <div class="social-overlay-title">Social</div>
            <div class="social-overlay-list" id="socialOverlayList"></div>
        </div>
        <div class="nav-overlay" id="navOverlay">
            <canvas class="overlay-bg-canvas" id="navBgCanvas"></canvas>
            <button class="overlay-close-btn" id="closeNavOverlay">✕</button>
            <div class="nav-overlay-title">Menu</div>
            <div class="nav-overlay-list" id="navOverlayList">
                <a href="discography.html"><span>DISCOGRAPHY</span></a>
                <a href="videos.html"><span>MUSIC VIDEOS</span></a>
                <a href="shop.html"><span>SHOP</span></a>
                <a href="schedule.html"><span>SCHEDULE</span></a>
                <a href="archive.html"><span>ARCHIVE</span></a>
                <a href="special.html"><span>SPECIAL</span></a>
            </div>
        </div>

        <div class="top-bar"><div class="top-bar-inner">
            <div class="logo-wrapper"><a href="index.html"><img src="Images/logo.png" alt="CallbyBreath" class="logo" id="logoImg"></a></div>
            <nav class="nav">
                <a href="discography.html"><span>DISCOGRAPHY</span></a>
                <a href="videos.html"><span>MUSIC VIDEOS</span></a>
                <a href="shop.html"><span>SHOP</span></a>
                <button class="more-toggle" id="moreToggle"><span>MORE</span></button>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div></div>

        <div class="page-content" id="pageContent">
            <div id="loadingIndicator">Loading</div>

            <div id="shopView">
                <h1 class="shop-title">SHOP</h1>
                <div class="search-container">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search...">
                </div>
                <a href="links.html" class="follow-platform-btn">FOLLOW YOUR PLATFORM</a>
                <div class="shop-grid" id="shopGrid"></div>
            </div>

            <!-- Purchased view and button removed -->

            <div class="direct-fullscreen" id="directFullscreen">
                <button class="back-to-shop-btn" id="backToShopFromDirect">Back to Shop</button>
                <div class="direct-card" id="directCard">
                    <div class="direct-image" id="directImage"></div>
                    <div class="direct-info" id="directInfo"></div>
                </div>
            </div>
        </div>

        <div class="agreement-overlay" id="agreementOverlay">
            <div class="agreement-box">
                <h3>Terms of Purchase</h3>
                <p>By making a purchase, you agree to our <a href="rules.html" target="_blank">Rules</a>. Please read them carefully before continuing.</p>
                <div class="agreement-check">
                    <input type="checkbox" id="agreementCheckbox">
                    <label for="agreementCheckbox">I accept the terms</label>
                </div>
                <button class="btn-agree" id="btnAgree" disabled>Continue</button>
            </div>
        </div>

        <div class="product-detail-overlay" id="productDetailOverlay">
            <canvas class="overlay-bg-canvas" id="productDetailBgCanvas"></canvas>
            <button class="close-overlay-btn" id="closeProductOverlay">✕</button>
            <div class="product-detail-card" id="productDetailCard"></div>
        </div>

        <div class="product-detail-overlay" id="downloadOverlay">
            <canvas class="overlay-bg-canvas" id="downloadBgCanvas"></canvas>
            <button class="close-overlay-btn" id="closeDownloadOverlay">✕</button>
            <div class="product-detail-card" id="downloadCard"></div>
        </div>

        <div class="product-detail-overlay" id="includeMoreOverlay" style="z-index: 2000;">
            <canvas class="overlay-bg-canvas" id="includeMoreBgCanvas"></canvas>
            <button class="close-overlay-btn" id="closeIncludeMoreOverlay">✕</button>
            <div class="product-detail-card" style="display:flex; flex-direction:column; align-items:center; gap:1rem;">
                <h3 class="include-more-title">Include</h3>
                <ul class="include-full-list"></ul>
            </div>
        </div>

        <div class="bottom-bar"><div class="bottom-bar-inner" id="bottomSocials">
            <button class="mobile-social-btn" id="mobileSocialBtn">SOCIAL</button>
        </div></div>
    </div>
    <div class="right-panel"></div>

    <script src="shop-config.js"></script>
    <script>
        (function() {
            const globalCanvas = document.getElementById('globalBgCanvas');
            const ctx = globalCanvas.getContext('2d');
            const blobs = Array.from({length:6}, () => ({ x: 0.1+Math.random()*0.8, y: 0.1+Math.random()*0.8, r: 0.12+Math.random()*0.28 }));

            function drawGlobalBg() {
                const w = globalCanvas.width = window.innerWidth;
                const h = globalCanvas.height = window.innerHeight;
                ctx.clearRect(0,0,w,h);
                ctx.globalCompositeOperation = 'lighter';
                blobs.forEach(b => {
                    const cx = b.x * w, cy = b.y * h, maxR = b.r * Math.max(w,h);
                    const grad = ctx.createRadialGradient(cx,cy,maxR*0.2,cx,cy,maxR);
                    grad.addColorStop(0,'rgba(0,255,0,0.45)');
                    grad.addColorStop(0.2,'rgba(0,255,0,0.30)');
                    grad.addColorStop(0.4,'rgba(0,255,0,0.18)');
                    grad.addColorStop(0.6,'rgba(0,255,0,0.08)');
                    grad.addColorStop(0.8,'rgba(0,255,0,0.03)');
                    grad.addColorStop(1,'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx,cy,maxR,0,Math.PI*2);
                    ctx.fill();
                });
                ctx.globalCompositeOperation = 'source-over';
            }
            window.addEventListener('resize', drawGlobalBg);
            drawGlobalBg();

            function copyBgToOverlay(canvas) {
                if (!canvas) return;
                const c = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                c.drawImage(globalCanvas, 0, 0);
            }

            window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
            window.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && (e.key==='+'||e.key==='-'||e.key==='0')) e.preventDefault(); });
            document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

            const loadingEl = document.getElementById('loadingIndicator');
            let dots = 0;
            const loadingInterval = setInterval(() => {
                dots = (dots+1)%4;
                loadingEl.textContent = 'Loading' + '.'.repeat(dots);
            }, 500);

            const AGREEMENT_KEY = 'callbybreath_agreed';
            let pendingPurchaseAction = null;
            function showAgreementOverlay(actionCallback) {
                const overlay = document.getElementById('agreementOverlay');
                const checkbox = document.getElementById('agreementCheckbox');
                const btn = document.getElementById('btnAgree');
                checkbox.checked = false;
                btn.disabled = true;
                overlay.classList.add('open');
                pendingPurchaseAction = actionCallback;
            }
            document.getElementById('agreementCheckbox').addEventListener('change', function() {
                document.getElementById('btnAgree').disabled = !this.checked;
            });
            document.getElementById('btnAgree').addEventListener('click', function() {
                localStorage.setItem(AGREEMENT_KEY, 'true');
                document.getElementById('agreementOverlay').classList.remove('open');
                if (pendingPurchaseAction) { pendingPurchaseAction(); pendingPurchaseAction = null; }
            });
            function hasAgreed() { return localStorage.getItem(AGREEMENT_KEY) === 'true'; }

            function closeAllOverlays() {
                ['moreOverlay','socialOverlay','navOverlay'].forEach(id => document.getElementById(id).classList.remove('open'));
                const mb = document.getElementById('mobileMenuBtn');
                if (mb) { mb.classList.remove('open'); mb.textContent = '☰'; }
                document.getElementById('productDetailOverlay').classList.remove('open');
                document.getElementById('productDetailCard').innerHTML = '';
                document.getElementById('downloadOverlay').classList.remove('open');
                document.getElementById('downloadCard').innerHTML = '';
                document.getElementById('agreementOverlay').classList.remove('open');
                document.getElementById('includeMoreOverlay').classList.remove('open');
            }

            document.getElementById('moreToggle').addEventListener('click', e => {
                e.stopPropagation();
                const ov = document.getElementById('moreOverlay');
                ov.classList.toggle('open');
                if (ov.classList.contains('open')) copyBgToOverlay(document.getElementById('moreBgCanvas'));
            });
            document.getElementById('closeMoreOverlay').addEventListener('click', () => document.getElementById('moreOverlay').classList.remove('open'));
            document.getElementById('mobileSocialBtn').addEventListener('click', e => {
                e.stopPropagation();
                const ov = document.getElementById('socialOverlay');
                ov.classList.toggle('open');
                if (ov.classList.contains('open')) copyBgToOverlay(document.getElementById('socialBgCanvas'));
            });
            document.getElementById('closeSocialOverlay').addEventListener('click', () => document.getElementById('socialOverlay').classList.remove('open'));
            document.getElementById('mobileMenuBtn').addEventListener('click', () => {
                const ov = document.getElementById('navOverlay');
                ov.classList.toggle('open');
                document.getElementById('mobileMenuBtn').classList.toggle('open');
                document.getElementById('mobileMenuBtn').textContent = ov.classList.contains('open') ? '✕' : '☰';
                if (ov.classList.contains('open')) copyBgToOverlay(document.getElementById('navBgCanvas'));
            });
            document.getElementById('closeNavOverlay').addEventListener('click', () => {
                document.getElementById('navOverlay').classList.remove('open');
                document.getElementById('mobileMenuBtn').classList.remove('open');
                document.getElementById('mobileMenuBtn').textContent = '☰';
            });
            document.querySelectorAll('.more-overlay, .social-overlay, .nav-overlay').forEach(o => {
                o.addEventListener('click', function(e) { if (e.target === this) closeAllOverlays(); });
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllOverlays(); });

            const socialLinks = [
                { name:'youtube', url:'https://www.youtube.com/@CallbyBreath' },
                { name:'twitter', url:'https://x.com/xCallbyBreath' },
                { name:'instagram', url:'https://instagram.com/callbybreath.official' },
                { name:'telegram', url:'https://t.me/callbybreath' }
            ];
            const bottomSocials = document.getElementById('bottomSocials');
            socialLinks.forEach(l => {
                const a = document.createElement('a'); a.className = 'bottom-social-link'; a.href = l.url; a.target = '_blank'; a.innerHTML = `<span>${l.name}</span>`;
                bottomSocials.appendChild(a);
            });
            const socialOverlayList = document.getElementById('socialOverlayList');
            socialLinks.forEach(l => {
                const a = document.createElement('a'); a.href = l.url; a.target = '_blank'; a.innerHTML = `<span>${l.name.toUpperCase()}</span>`;
                socialOverlayList.appendChild(a);
            });

            const products = (shopConfig?.products || []).map((p, index) => ({ ...p, id: p.id ?? index + 1 }));
            const shopGrid = document.getElementById('shopGrid');
            const productDetailOverlay = document.getElementById('productDetailOverlay');
            const productDetailCard = document.getElementById('productDetailCard');
            const downloadOverlay = document.getElementById('downloadOverlay');
            const downloadCard = document.getElementById('downloadCard');
            const closeProductOverlayBtn = document.getElementById('closeProductOverlay');
            const closeDownloadOverlayBtn = document.getElementById('closeDownloadOverlay');
            const searchInput = document.getElementById('searchInput');
            const productDetailBgCanvas = document.getElementById('productDetailBgCanvas');
            const downloadBgCanvas = document.getElementById('downloadBgCanvas');
            const directFullscreen = document.getElementById('directFullscreen');
            const directCard = document.getElementById('directCard');
            const directImage = document.getElementById('directImage');
            const directInfo = document.getElementById('directInfo');
            const backToShopFromDirect = document.getElementById('backToShopFromDirect');

            let currentSearch = '';

            function animateCards() {
                const cards = shopGrid.querySelectorAll('.shop-item:not(.hidden)');
                cards.forEach((c, i) => { c.classList.remove('visible'); setTimeout(() => c.classList.add('visible'), i * 60); });
            }

            function renderShopGrid(filter = '') {
                currentSearch = filter;
                const term = filter.trim().toLowerCase();
                shopGrid.innerHTML = '';
                products.forEach(prod => {
                    const item = document.createElement('div');
                    item.className = 'shop-item';
                    if (term && !prod.name.toLowerCase().includes(term)) item.classList.add('hidden');

                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'shop-item-image';
                    const img = document.createElement('img');
                    img.src = prod.image; img.alt = prod.name; img.loading = 'lazy';
                    imgDiv.appendChild(img);

                    if (prod.type) {
                        const badge = document.createElement('span');
                        badge.className = 'shop-item-type-badge';
                        badge.textContent = prod.type;
                        imgDiv.appendChild(badge);
                    }

                    const title = document.createElement('div');
                    title.className = 'shop-item-title';
                    title.textContent = prod.name;

                    const price = document.createElement('div');
                    price.className = 'shop-item-price';
                    price.textContent = prod.price;

                    // Purchase button
                    const purchaseBtn = document.createElement('button');
                    purchaseBtn.className = 'shop-item-action';
                    purchaseBtn.textContent = 'PURCHASE';
                    purchaseBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const link = prod.purchaseLink || '#';
                        if (!hasAgreed()) {
                            showAgreementOverlay(() => window.open(link, '_blank'));
                        } else {
                            window.open(link, '_blank');
                        }
                    });

                    item.appendChild(imgDiv);
                    item.appendChild(title);
                    item.appendChild(price);
                    item.appendChild(purchaseBtn);

                    // Click on card (not button) opens detail
                    item.addEventListener('click', (e) => {
                        if (e.target.closest('button')) return;
                        openProductDetail(prod);
                    });

                    shopGrid.appendChild(item);
                });
                animateCards();
            }

            function showDownloadLinks(product) {
                // This function is no longer used for purchased, but kept for potential direct download links
                // In case we need to show download links from direct link product view
                if (!hasAgreed()) { showAgreementOverlay(() => showDownloadLinks(product)); return; }
                closeAllOverlays();
                copyBgToOverlay(downloadBgCanvas);
                const dLinks = product.downloadLinks || {};
                let linksHtml = '';
                if (dLinks.mega) linksHtml += `<a href="${dLinks.mega}" target="_blank">Get on Mega</a>`;
                if (dLinks.googleDrive) linksHtml += `<a href="${dLinks.googleDrive}" target="_blank">Get on Google Drive</a>`;
                if (dLinks.mediaFire) linksHtml += `<a href="${dLinks.mediaFire}" target="_blank">Get on MediaFire</a>`;
                if (dLinks.yandexDisk) linksHtml += `<a href="${dLinks.yandexDisk}" target="_blank">Get on Yandex Disk</a>`;
                const includeHtml = renderIncludeBlock(product.include || []);
                const html = `
                    <button class="copy-link-btn" id="downloadCopyLinkBtn">Copy Link</button>
                    <div class="product-detail-image"><img src="${product.image}" alt="${product.name}"></div>
                    <div class="product-detail-info">
                        <h2 class="product-detail-title">${product.name}</h2>
                        ${includeHtml}
                        <div class="purchase-links"><h4>Download Links:</h4>${linksHtml}</div>
                    </div>`;
                downloadCard.innerHTML = html;
                downloadOverlay.classList.add('open');
                document.getElementById('downloadCopyLinkBtn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const url = new URL(window.location.origin + window.location.pathname);
                    url.searchParams.set('product', product.id);
                    navigator.clipboard.writeText(url.toString()).then(() => alert('Link copied!')).catch(() => {
                        const ta = document.createElement('textarea'); ta.value = url.toString();
                        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                        document.body.removeChild(ta); alert('Link copied!');
                    });
                });
                closeDownloadOverlayBtn.onclick = () => { downloadOverlay.classList.remove('open'); downloadCard.innerHTML = ''; };
                downloadOverlay.onclick = (e) => { if (e.target === downloadOverlay) { downloadOverlay.classList.remove('open'); downloadCard.innerHTML = ''; } };
            }

            function renderIncludeBlock(includeArray, ulClass = 'product-include') {
                if (!includeArray || includeArray.length === 0) return '';
                if (includeArray.length <= 2) {
                    return `<ul class="${ulClass}"><h4>Include:</h4>${includeArray.map(i => `<li>${i}</li>`).join('')}</ul>`;
                } else {
                    const firstTwo = includeArray.slice(0,2).map(i => `<li>${i}</li>`).join('');
                    const encoded = encodeURIComponent(JSON.stringify(includeArray));
                    return `<ul class="${ulClass}"><h4>Include:</h4>${firstTwo}<li class="include-more-li"><button class="include-more-btn" data-include-list="${encoded}">More (${includeArray.length})</button></li></ul>`;
                }
            }

            function openIncludeMoreOverlay(includeArray) {
                const overlay = document.getElementById('includeMoreOverlay');
                copyBgToOverlay(document.getElementById('includeMoreBgCanvas'));
                const list = overlay.querySelector('.include-full-list');
                list.innerHTML = includeArray.map(i => `<li>${i}</li>`).join('');
                overlay.classList.add('open');
                document.getElementById('closeIncludeMoreOverlay').onclick = () => overlay.classList.remove('open');
                overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('open'); };
            }

            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('include-more-btn')) {
                    e.stopPropagation();
                    const encoded = e.target.getAttribute('data-include-list');
                    const includeArray = JSON.parse(decodeURIComponent(encoded));
                    openIncludeMoreOverlay(includeArray);
                }
            });

            function openProductDetail(product, fromDirectLink = false) {
                closeAllOverlays();
                const includeList = product.include || [];
                const buyLink = product.buyLink || '';
                const purchaseLink = product.purchaseLink || '';

                if (fromDirectLink) {
                    document.getElementById('shopView').classList.add('hidden');
                    directFullscreen.classList.add('active');
                    directImage.innerHTML = `<img src="${product.image}" alt="${product.name}">`;

                    let actionsHtml = '';
                    // Always show download links if available
                    const dl = product.downloadLinks || {};
                    let links = '';
                    if (dl.mega) links += `<a href="${dl.mega}" target="_blank">Get on Mega</a>`;
                    if (dl.googleDrive) links += `<a href="${dl.googleDrive}" target="_blank">Get on Google Drive</a>`;
                    if (dl.mediaFire) links += `<a href="${dl.mediaFire}" target="_blank">Get on MediaFire</a>`;
                    if (dl.yandexDisk) links += `<a href="${dl.yandexDisk}" target="_blank">Get on Yandex Disk</a>`;
                    if (links) {
                        actionsHtml += `<div class="purchase-links"><h4>Download Links:</h4>${links}</div>`;
                    }

                    // Purchase button
                    if (purchaseLink) {
                        actionsHtml += `<a href="${purchaseLink}" target="_blank" class="btn-buy" id="directPurchaseBtn">PURCHASE</a>`;
                    } else if (buyLink) {
                        actionsHtml += `<a href="${buyLink}" target="_blank" class="btn-buy" id="directPurchaseBtn">PURCHASE</a>`;
                    } else {
                        actionsHtml += `<button class="btn-buy" id="directPurchaseBtn" disabled>NOT AVAILABLE</button>`;
                    }

                    const includeHtml = renderIncludeBlock(includeList);
                    directInfo.innerHTML = `<h2 class="direct-title">${product.name}</h2><div class="direct-include">${includeHtml}</div><div class="direct-actions">${actionsHtml}</div>`;
                } else {
                    copyBgToOverlay(productDetailBgCanvas);
                    let html = `<button class="copy-link-btn" id="copyLinkBtn">Copy Link</button><div class="product-detail-image"><img src="${product.image}" alt="${product.name}"></div><div class="product-detail-info"><h2 class="product-detail-title">${product.name}</h2>${renderIncludeBlock(includeList)}<div class="product-actions">`;

                    // Always show download links if available
                    const dl = product.downloadLinks || {};
                    let links = '';
                    if (dl.mega) links += `<a href="${dl.mega}" target="_blank">Get on Mega</a>`;
                    if (dl.googleDrive) links += `<a href="${dl.googleDrive}" target="_blank">Get on Google Drive</a>`;
                    if (dl.mediaFire) links += `<a href="${dl.mediaFire}" target="_blank">Get on MediaFire</a>`;
                    if (dl.yandexDisk) links += `<a href="${dl.yandexDisk}" target="_blank">Get on Yandex Disk</a>`;
                    if (links) {
                        html += `<div class="purchase-links"><h4>Download Links:</h4>${links}</div>`;
                    }

                    // Purchase button
                    if (purchaseLink) {
                        html += `<a href="${purchaseLink}" target="_blank" class="btn-buy" id="detailPurchaseBtn">PURCHASE</a>`;
                    } else if (buyLink) {
                        html += `<a href="${buyLink}" target="_blank" class="btn-buy" id="detailPurchaseBtn">PURCHASE</a>`;
                    } else {
                        html += `<button class="btn-buy" id="detailPurchaseBtn" disabled>NOT AVAILABLE</button>`;
                    }

                    html += `</div></div>`;
                    productDetailCard.innerHTML = html;
                    productDetailOverlay.classList.add('open');

                    const copyBtn = document.getElementById('copyLinkBtn');
                    if (copyBtn) {
                        copyBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const url = new URL(window.location.origin + window.location.pathname);
                            url.searchParams.set('product', product.id);
                            navigator.clipboard.writeText(url.toString()).then(() => alert('Link copied!')).catch(() => {
                                const ta = document.createElement('textarea'); ta.value = url.toString();
                                document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                                document.body.removeChild(ta); alert('Link copied!');
                            });
                        });
                    }

                    const closeHandler = () => { productDetailOverlay.classList.remove('open'); productDetailCard.innerHTML = ''; };
                    closeProductOverlayBtn.onclick = closeHandler;
                    productDetailOverlay.onclick = (e) => { if (e.target === productDetailOverlay) closeHandler(); };
                }
            }

            backToShopFromDirect.addEventListener('click', () => {
                directFullscreen.classList.remove('active');
                document.getElementById('shopView').classList.remove('hidden');
                history.replaceState(null, '', window.location.pathname);
            });

            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('product');
            if (productId) {
                const product = products.find(p => p.id == productId);
                if (product) setTimeout(() => openProductDetail(product, true), 500);
            }

            renderShopGrid();
            searchInput.addEventListener('input', () => renderShopGrid(searchInput.value));

            // Decorative effects
            let trailTimeout;
            document.addEventListener('mousemove', e => {
                if (trailTimeout) return;
                trailTimeout = setTimeout(() => {
                    trailTimeout = null;
                    const dot = document.createElement('div'); dot.className = 'cursor-trail';
                    dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px';
                    document.body.appendChild(dot); setTimeout(() => dot.remove(), 600);
                }, 50);
            });
            const symbols = ['☆','✧','✦','★','⭑'];
            function spawnParticles(e) {
                for (let i=0; i<6; i++) {
                    const p = document.createElement('span'); p.className = 'particle';
                    p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
                    p.style.left = e.clientX+'px'; p.style.top = e.clientY+'px';
                    p.style.color = Math.random()>0.5 ? '#00ff00' : '#66ff66';
                    const a = (Math.PI*2*i)/6, d = 15+Math.random()*25;
                    p.style.setProperty('--dx', Math.cos(a)*d+'px'); p.style.setProperty('--dy', Math.sin(a)*d+'px');
                    document.body.appendChild(p); setTimeout(() => p.remove(), 800);
                }
            }
            function attachParticles(sel) { document.querySelectorAll(sel).forEach(e => e.addEventListener('mouseenter', spawnParticles)); }
            function makeWobbly(sel) {
                document.querySelectorAll(sel).forEach(el => {
                    if (el.classList.contains('watch-btn') || el.closest('.watch-btn') || el.classList.contains('wobbly-done')) return;
                    el.classList.add('wobbly-done','wobbly-text');
                    const text = el.textContent; el.textContent = '';
                    [...text].forEach(c => {
                        const s = document.createElement('span'); s.className = 'char';
                        s.textContent = c===' ' ? '\u00A0' : c;
                        s.style.setProperty('--wx', (Math.random()-0.5)*3+'px'); s.style.setProperty('--wy', (Math.random()-0.5)*3+'px'); s.style.setProperty('--wr', (Math.random()-0.5)*4+'deg');
                        el.appendChild(s);
                    });
                });
            }
            setTimeout(() => {
                makeWobbly('.nav a'); makeWobbly('.more-toggle'); makeWobbly('.bottom-social-link');
                makeWobbly('.more-overlay-list a'); makeWobbly('.nav-overlay-list a'); makeWobbly('.mobile-social-btn'); makeWobbly('.social-overlay-list a');
                attachParticles('.nav a'); attachParticles('.more-toggle'); attachParticles('.bottom-social-link');
                attachParticles('.more-overlay-list a'); attachParticles('.nav-overlay-list a'); attachParticles('.mobile-social-btn'); attachParticles('.social-overlay-list a');
                attachParticles('.logo'); attachParticles('.follow-platform-btn');
                loadingEl.classList.add('hidden'); clearInterval(loadingInterval);
            }, 3000);

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
        })();
    </script>
</body>
</html>
