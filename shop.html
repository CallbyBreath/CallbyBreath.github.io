<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Callbybreath Official Website – Shop</title>
    <link rel="icon" type="image/png" href="Images/logo.png">
    <style>
        /* ========== ШРИФТЫ ========== */
        @font-face { font-family: 'Press Start 2P'; src: url('Font/PressStart2P.ttf') format('truetype'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'Rubik Spray Paint'; src: url('Font/RubikSprayPaint-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'OldNewspaperTypes'; src: url('Font/OldNewspaperTypes.ttf') format('truetype'); font-weight: normal; font-style: normal; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Press Start 2P', sans-serif; color: #1f2024; line-height: 1.5;
            display: flex; flex-direction: row; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            height: 100%; overflow: hidden; position: fixed; width: 100%; background: #141416; touch-action: manipulation;
        }
        img { -webkit-user-drag: none; -khtml-user-drag: none; -moz-user-drag: none; -o-user-drag: none; user-drag: none; pointer-events: auto; }

        /* ========== ДЕКОРАТИВНЫЕ ЧАСТИЦЫ И СЛЕД ========== */
        .particle { position: fixed; pointer-events: none; z-index: 9999; font-size: 1.2rem; animation: particleFade 0.8s ease-out forwards; font-family: 'Press Start 2P', sans-serif; }
        @keyframes particleFade { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(0.3); } }
        .cursor-trail { position: fixed; pointer-events: none; z-index: 10000; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); box-shadow: 0 0 6px rgba(255,255,255,0.4); animation: trailFade 0.6s ease-out forwards; }
        @keyframes trailFade { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(0); } }

        /* ========== ВОББЛИ-ТЕКСТ ========== */
        .wobbly-text { display: inline-block; }
        .wobbly-text .char { display: inline-block; transition: transform 0.25s ease-out, filter 0.25s ease-out; position: relative; z-index: 1; }
        .wobbly-text:hover .char { z-index: 2; transform: translate(var(--wx), var(--wy)) rotate(var(--wr)); filter: brightness(1.5); }

        /* ========== ОВЕРЛЕИ НАВИГАЦИИ ========== */
        .more-overlay, .social-overlay, .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #141416; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(1.5rem, 3vh, 2.5rem);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; overflow: hidden;
        }
        .more-overlay.open, .social-overlay.open, .nav-overlay.open { opacity: 1; pointer-events: auto; }
        .overlay-bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .overlay-close-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #f0fff8; font-size: 2rem; cursor: pointer; z-index: 20; line-height: 1; transition: color 0.2s; }
        .overlay-close-btn:hover { color: #ffcc00; }
        .more-overlay-title, .social-overlay-title, .nav-overlay-title {
            font-family: 'Rubik Spray Paint', sans-serif; font-size: clamp(1.5rem, 3vw, 2.5rem); color: #f0fff8; text-transform: uppercase; letter-spacing: 5px; opacity: 0.9; margin-bottom: 1rem; position: relative; z-index: 2; text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .more-overlay-list, .social-overlay-list, .nav-overlay-list { display: flex; flex-direction: column; gap: clamp(0.8rem, 1.5vh, 1.2rem); min-width: 250px; position: relative; z-index: 2; }
        .more-overlay-list a, .social-overlay-list a, .nav-overlay-list a {
            display: flex; align-items: center; justify-content: center; gap: 0.8rem; padding: clamp(1rem, 2vh, 1.5rem) clamp(1.5rem, 3vw, 2.5rem);
            color: #f0fff8; text-decoration: none; font-family: 'Press Start 2P', sans-serif; font-size: clamp(0.7rem, 1.2vw, 0.9rem); letter-spacing: 2px; border-radius: 10px;
            transition: color 0.2s ease; text-transform: uppercase; text-align: center; text-shadow: 0 0 12px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.6);
        }
        .more-overlay-list a:hover, .social-overlay-list a:hover, .nav-overlay-list a:hover { color: #ffcc00; }

        /* ========== ГЛОБАЛЬНЫЙ ФОН ========== */
        #globalBgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        /* ========== БЕЛЫЕ БОКОВЫЕ ПАНЕЛИ ========== */
        .left-panel, .right-panel { width: clamp(40px, 5vw, 64px); flex-shrink: 0; height: 100vh; position: relative; z-index: 5; background: #ffffff; }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 10; height: 100%; }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ НАВИГАЦИИ ========== */
        .top-bar { width: 100%; padding: 0; flex-shrink: 0; position: relative; z-index: 100; background: #ffffff; }
        .top-bar-inner { width: 100%; height: clamp(48px, 8vh, 64px); display: flex; align-items: center; justify-content: space-between; padding: 0; position: relative; }
        .logo-wrapper { position: relative; display: inline-block; padding-left: 0.5rem; }
        .logo { height: clamp(36px, 6vh, 48px); width: auto; display: block; cursor: pointer; filter: brightness(0) saturate(100%) invert(10%) sepia(78%) saturate(4617%) hue-rotate(350deg) brightness(92%) contrast(108%); transition: transform 0.2s ease; }
        .logo:hover { transform: scale(1.05); }
        .nav { display: flex; gap: 1.2rem; align-items: center; padding-right: 0; }
        .nav a { text-decoration: none; font-size: 0.7rem; letter-spacing: 0.3px; color: #700707; transition: color 0.2s; padding: 0.5rem 0.8rem; border-radius: 10px; text-shadow: 0 0 6px rgba(112,7,7,0.3); }
        .nav a:last-child { padding-right: 0.5rem; }
        .nav a:hover { color: #990000; text-shadow: 0 0 10px rgba(153,0,0,0.5); }
        .more-toggle { text-decoration: none; font-size: 0.7rem; letter-spacing: 0.3px; color: #700707; transition: color 0.2s; padding: 0.5rem 0.8rem; cursor: pointer; background: none; border: none; border-radius: 10px; font-family: 'Press Start 2P', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; text-shadow: 0 0 6px rgba(112,7,7,0.3); }
        .more-toggle:focus { outline: none; }
        .more-toggle:hover { color: #990000; text-shadow: 0 0 10px rgba(153,0,0,0.5); }
        .mobile-menu-btn { display: none; background: transparent; border: none; color: #700707; font-size: 1.8rem; cursor: pointer; padding: 0 0.5rem 0 0; line-height: 1; transition: color 0.2s, transform 0.3s ease; }
        .mobile-menu-btn:hover { color: #4a0000; }
        .mobile-menu-btn.open { transform: rotate(90deg); }

        /* ========== КОНТЕНТ СТРАНИЦЫ ========== */
        .page-content { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; -ms-overflow-style: none; padding: 1rem clamp(0.5rem, 2vw, 1.5rem); display: flex; flex-direction: column; align-items: center; position: relative; background: transparent; }
        .page-content::-webkit-scrollbar { display: none; }

        #shopView { display: flex; flex-direction: column; align-items: center; width: 100%; }
        #shopView.hidden { display: none; }

        #loadingIndicator { position: absolute; top: 20px; left: 20px; z-index: 1000; background: #000; color: #fff; font-family: 'Press Start 2P', sans-serif; font-size: 0.4rem; padding: 4px 8px; border-radius: 3px; opacity: 1; transition: opacity 0.4s ease; white-space: nowrap; pointer-events: auto; }
        #loadingIndicator.hidden { opacity: 0; pointer-events: none; }

        .shop-title {
            font-family: 'Rubik Spray Paint', sans-serif;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            color: #f0fff8; text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0,0,0,0.7), 0 0 40px rgba(0,0,0,0.5);
            margin: 1.5rem 0 1rem;
        }

        .search-container { width: 100%; max-width: 400px; margin: 0 auto 1.5rem; position: relative; }
        .search-input { width: 100%; padding: 0.6rem 1rem; background: #1f2024; border: 2px solid rgba(255,230,200,0.6); border-radius: 10px; color: #f0fff8; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; outline: none; text-align: center; transition: border-color 0.3s; }
        .search-input:focus { border-color: #ffcc00; }
        .search-input::placeholder { color: rgba(240,255,248,0.4); }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; width: 100%; max-width: 1200px; margin-bottom: 2rem; }

        /* ===== КАРТОЧКА ТОВАРА (без рамки, свечение на изображении) ===== */
        .shop-item {
            background: #141416;
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: opacity 0.35s ease;
            opacity: 0;
            cursor: pointer;
            position: relative;
        }
        .shop-item.visible { opacity: 1; }
        .shop-item.hidden { display: none; }

        /* Изображение с обводкой и свечением – точь-в-точь как в discography */
        .shop-item-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: #141416;
            border: 2px solid rgba(255,230,200,0.7);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 0.5rem;
            position: relative;
            box-shadow: 0 0 8px rgba(255,220,170,0.5), 0 0 15px rgba(0,0,0,0.4);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .shop-item:hover .shop-item-image {
            border-color: rgba(255,245,220,1);
            box-shadow: 0 0 18px rgba(255,230,190,0.95), 0 0 40px rgba(255,210,150,0.75), 0 0 70px rgba(255,170,90,0.55), 0 0 110px rgba(255,130,50,0.45), 0 0 160px rgba(255,100,25,0.35), 0 0 230px rgba(255,70,15,0.18), 0 0 8px rgba(0,0,0,0.5);
        }
        .shop-item-image img { width: 100%; height: 100%; object-fit: contain; }

        /* Бейдж типа товара – в точности как в discography */
        .shop-item-type-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: #ffcc00;
            color: #141416;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.35rem;
            padding: 2px 6px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 5;
        }

        .shop-item-title { font-family: 'OldNewspaperTypes', 'Press Start 2P', sans-serif; font-size: 0.7rem; color: #f0fff8; margin: 0.5rem 0; text-transform: uppercase; word-break: break-word; }
        .shop-item-price { font-family: 'Press Start 2P', sans-serif; font-size: 0.7rem; color: #ffcc00; margin-bottom: 0.8rem; }
        .shop-item-controls { display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; flex-wrap: wrap; }
        .shop-item-action { background: #ffcc00; color: #141416; font-family: 'Press Start 2P', sans-serif; font-size: 0.55rem; padding: 0.5rem 1rem; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; transition: background 0.2s; text-transform: uppercase; white-space: nowrap; }
        .shop-item-action:hover { background: #ffaa00; }

        /* Блок ввода кода */
        .code-input-wrapper { display: none; flex-direction: column; align-items: center; gap: 0.4rem; width: 100%; margin-top: 0.5rem; }
        .code-input-wrapper .purchase-input-small { padding: 0.4rem; background: #1f2024; border: 1px solid rgba(255,230,200,0.6); border-radius: 6px; color: #f0fff8; font-family: 'Press Start 2P', sans-serif; font-size: 0.5rem; outline: none; text-align: center; width: 100%; max-width: 160px; text-transform: uppercase; }
        .code-input-wrapper .purchase-error-small { color: #ff4444; font-size: 0.45rem; min-height: 1em; }

        /* ========== КНОПКА PURCHASED ========== */
        .purchased-button {
            position: fixed;
            bottom: 85px;
            right: calc(clamp(40px, 5vw, 64px) + 20px);
            background: #ffcc00; color: #141416;
            font-family: 'Press Start 2P', sans-serif; font-size: 0.55rem;
            padding: 0.6rem 1.2rem; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; gap: 0.5rem;
            z-index: 200; box-shadow: 0 0 15px rgba(255,200,40,0.6);
            transition: background 0.2s, box-shadow 0.2s; user-select: none;
        }
        .purchased-button:hover { background: #ffaa00; box-shadow: 0 0 25px rgba(255,200,40,0.9); }
        .purchased-count { font-size: 0.7rem; background: #141416; color: #ffcc00; border-radius: 12px; padding: 0.15rem 0.5rem; min-width: 1.8em; text-align: center; }

        #purchasedView { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #141416; z-index: 60; display: none; flex-direction: column; overflow-y: auto; padding: 1rem; }
        #purchasedView.active { display: flex; }
        #purchasedView .close-purchased-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #f0fff8; font-size: 2rem; cursor: pointer; z-index: 10; }
        #purchasedView .close-purchased-btn:hover { color: #ffcc00; }
        .purchased-title { font-family: 'Rubik Spray Paint', sans-serif; font-size: clamp(1.5rem, 3vw, 2rem); color: #f0fff8; text-transform: uppercase; letter-spacing: 4px; text-align: center; margin-bottom: 1.5rem; }
        .purchased-items { display: flex; flex-direction: column; gap: 1.2rem; }
        .purchased-item { display: flex; align-items: center; gap: 1.5rem; background: #1a3a1a; border: 1px solid #55aa55; border-radius: 10px; padding: 1.2rem; cursor: pointer; transition: background 0.2s; }
        .purchased-item:hover { background: #224422; }
        .purchased-item-image { width: 100px; height: 100px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #141416; }
        .purchased-item-image img { width: 100%; height: 100%; object-fit: contain; }
        .purchased-item-info { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; color: #f0fff8; }
        .purchased-item-title { font-family: 'OldNewspaperTypes', 'Press Start 2P', sans-serif; font-size: 1rem; color: #f0fff8; text-transform: uppercase; }
        .purchased-item-price { font-family: 'Press Start 2P', sans-serif; font-size: 0.8rem; color: #ffcc00; }
        .purchased-item-include { font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; color: #ddd; list-style: none; padding-left: 0.8rem; margin-top: 0.2rem; }
        .purchased-item-include li { list-style: none; color: #f0fff8; }
        .purchased-item-include li::before { content: '▸ '; color: #ffcc00; }
        .purchased-item-include li.include-more-li { margin-top: 0.6rem; }
        .purchased-item-include li.include-more-li::before { content: none; }
        .download-links-purchased { display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.65rem; flex-shrink: 0; color: #f0fff8; }
        .download-links-purchased h4 { font-family: 'Press Start 2P', sans-serif; font-size: 0.7rem; color: #ffcc00; margin-bottom: 0.2rem; }
        .download-links-purchased a { color: #ffcc00; text-decoration: underline; }

        .purchased-save-load { display: flex; gap: 1rem; margin-top: 1rem; justify-content: center; }
        .btn-purchased-save, .btn-purchased-load { background: #333; color: #f0fff8; border: 1px solid #ffcc00; border-radius: 8px; padding: 0.6rem 1rem; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; cursor: pointer; transition: background 0.2s; text-decoration: none !important; }
        .btn-purchased-save:hover, .btn-purchased-load:hover { background: #444; }

        /* ========== УВЕЛИЧЕННОЕ ОКНО СОГЛАШЕНИЯ ========== */
        .agreement-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .agreement-overlay.open { opacity: 1; pointer-events: auto; }
        .agreement-box { background: #141416; border: 2px solid #ffcc00; border-radius: 20px; padding: 3rem; max-width: 650px; width: 95%; text-align: center; color: #f0fff8; }
        .agreement-box h3 { font-family: 'OldNewspaperTypes', sans-serif; font-size: 2rem; margin-bottom: 1.5rem; color: #f0fff8; }
        .agreement-box p { font-family: 'Press Start 2P', sans-serif; font-size: 0.65rem; margin-bottom: 2rem; line-height: 1.8; color: #f0fff8; }
        .agreement-box a { color: #ffcc00; text-decoration: underline; }
        .agreement-check { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 2rem; font-size: 0.7rem; color: #f0fff8; }
        .agreement-check input { width: 20px; height: 20px; cursor: pointer; }
        .btn-agree { background: #ffcc00; color: #141416; font-family: 'Press Start 2P', sans-serif; font-size: 0.8rem; padding: 0.8rem 2rem; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
        .btn-agree:disabled { background: #555; color: #999; cursor: not-allowed; }
        .btn-agree:not(:disabled):hover { background: #ffaa00; }

        /* ========== ДЕТАЛЬНАЯ КАРТОЧКА ТОВАРА ========== */
        .product-detail-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; overflow-y: auto; padding: 2rem clamp(0.5rem, 2vw, 1.5rem); }
        .product-detail-overlay.open { opacity: 1; pointer-events: auto; }
        .product-detail-overlay .overlay-bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .product-detail-overlay .close-overlay-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: #f0fff8; font-size: 2rem; cursor: pointer; z-index: 20; line-height: 1; transition: color 0.2s; }
        .product-detail-overlay .close-overlay-btn:hover { color: #ffcc00; }
        .product-detail-card { position: relative; z-index: 1; display: flex; gap: 2rem; max-width: 900px; width: 100%; background: #141416; border: 2px solid rgba(255,230,200,0.5); border-radius: 15px; padding: 2rem; box-shadow: 0 0 25px rgba(0,0,0,0.7); color: #f0fff8; }
        .product-detail-image { flex: 0 0 auto; width: 40%; max-width: 300px; border-radius: 10px; overflow: hidden; background: #141416; aspect-ratio: 1/1; }
        .product-detail-image img { width: 100%; height: 100%; object-fit: contain; }
        .product-detail-info { flex: 1; display: flex; flex-direction: column; gap: 1rem; color: #f0fff8; }
        .product-detail-title { font-family: 'OldNewspaperTypes', 'Rubik Spray Paint', sans-serif; font-size: 1.8rem; color: #f0fff8; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .product-include h4 { font-family: 'Press Start 2P', sans-serif; font-size: 0.7rem; color: #ffcc00; margin-bottom: 0.3rem; }
        .product-include ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.4rem; color: #f0fff8; }
        .product-include li { list-style: none; color: #f0fff8; }
        .product-include li::before { content: '▸ '; color: #ffcc00; }
        .product-include li.include-more-li { margin-top: 0.6rem; }
        .product-include li.include-more-li::before { content: none; }
        .product-actions { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .btn-buy, .btn-get {
            background: #ffcc00; color: #141416; font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem; padding: 0.6rem 1.5rem; border: none; border-radius: 8px;
            cursor: pointer; text-transform: uppercase; transition: background 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
            width: fit-content; text-decoration: none !important;
            min-width: 90px; text-align: center; box-sizing: border-box; line-height: 1.3;
        }
        .btn-buy:hover, .btn-get:hover { background: #ffaa00; }
        .divider { border: none; border-top: 2px solid rgba(255,230,200,0.4); margin: 1rem 0; }
        .buy-row { display: flex; align-items: center; gap: 0.8rem; }
        .purchase-input { padding: 0.6rem; background: #1f2024; border: 2px solid rgba(255,230,200,0.6); border-radius: 8px; color: #f0fff8; font-family: 'Press Start 2P', sans-serif; font-size: 0.7rem; outline: none; text-align: center; width: 200px; max-width: 100%; text-transform: uppercase; }
        .purchase-error { color: #ff4444; font-size: 0.55rem; min-height: 1.2em; }
        .purchase-links { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.5rem; color: #f0fff8; }
        .purchase-links h4 { font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; color: #ffcc00; margin-bottom: 0.2rem; }
        .purchase-links a { color: #ffcc00; text-decoration: underline; font-size: 0.6rem; font-family: 'Press Start 2P', sans-serif; }

        /* Кнопка Copy Link */
        .copy-link-btn {
            position: absolute; top: 10px; right: 10px; background: #ffcc00; color: #141416;
            border: none; border-radius: 8px; padding: 0.4rem 0.8rem; font-family: 'Press Start 2P', sans-serif;
            font-size: 0.5rem; cursor: pointer; z-index: 30; text-transform: uppercase; transition: background 0.2s;
            text-decoration: none !important;
        }
        .copy-link-btn:hover { background: #ffaa00; }

        /* Полноэкранный прямой просмотр */
        .direct-fullscreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #141416; z-index: 80; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 2rem; gap: 2rem; overflow-y: auto; color: #f0fff8;
        }
        .direct-fullscreen.active { display: flex; }
        .direct-fullscreen .direct-card {
            display: flex; gap: 2rem; max-width: 900px; width: 100%; background: #141416;
            border: 2px solid rgba(255,230,200,0.5); border-radius: 15px; padding: 2rem;
            box-shadow: 0 0 25px rgba(0,0,0,0.7); position: relative; color: #f0fff8;
        }
        .direct-fullscreen .direct-image {
            flex: 0 0 auto; width: 40%; max-width: 300px; border-radius: 10px;
            overflow: hidden; background: #141416; aspect-ratio: 1/1;
        }
        .direct-fullscreen .direct-image img { width: 100%; height: 100%; object-fit: contain; }
        .direct-fullscreen .direct-info { flex: 1; display: flex; flex-direction: column; gap: 1rem; color: #f0fff8; }
        .direct-fullscreen .direct-title {
            font-family: 'OldNewspaperTypes', 'Rubik Spray Paint', sans-serif;
            font-size: 1.8rem; color: #f0fff8; text-transform: uppercase; letter-spacing: 2px;
        }
        .direct-fullscreen .direct-include h4 { font-family: 'Press Start 2P', sans-serif; font-size: 0.7rem; color: #ffcc00; margin-bottom: 0.3rem; }
        .direct-fullscreen .direct-include ul { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; color: #f0fff8; }
        .direct-fullscreen .direct-include li { list-style: none; color: #f0fff8; }
        .direct-fullscreen .direct-include li::before { content: '▸ '; color: #ffcc00; }
        .direct-fullscreen .direct-include li.include-more-li { margin-top: 0.6rem; }
        .direct-fullscreen .direct-include li.include-more-li::before { content: none; }
        .direct-fullscreen .direct-actions { display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem; }
        .direct-fullscreen .direct-actions .btn-buy,
        .direct-fullscreen .direct-actions .btn-get {
            background: #ffcc00; color: #141416; font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem; padding: 0.6rem 1.5rem; border: none; border-radius: 8px;
            cursor: pointer; text-transform: uppercase; transition: background 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
            width: fit-content; text-decoration: none !important;
            min-width: 90px; text-align: center; box-sizing: border-box; line-height: 1.3;
        }
        .direct-fullscreen .direct-actions .purchase-input {
            padding: 0.6rem; background: #1f2024; border: 2px solid rgba(255,230,200,0.6);
            border-radius: 8px; color: #f0fff8; font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem; outline: none; text-align: center; width: 200px;
        }
        .direct-fullscreen .direct-actions .purchase-links a { color: #ffcc00; text-decoration: underline; font-size: 0.6rem; }
        .back-to-shop-btn {
            position: absolute; top: 20px; right: 20px; background: #ffcc00; color: #141416;
            border: none; border-radius: 8px; padding: 0.5rem 1rem; font-family: 'Press Start 2P', sans-serif;
            font-size: 0.5rem; cursor: pointer; z-index: 90; text-transform: uppercase;
            text-decoration: none !important;
        }
        .back-to-shop-btn:hover { background: #ffaa00; }

        /* ========== КНОПКА MORE ДЛЯ INCLUDE ========== */
        .include-more-btn {
            background: transparent; border: 2px solid #ffcc00; color: #ffcc00;
            font-family: 'Press Start 2P', sans-serif; font-size: 0.65rem; padding: 0.5rem 1.2rem;
            border-radius: 6px; cursor: pointer; text-transform: uppercase; transition: background 0.2s;
            display: inline-block;
        }
        .include-more-btn:hover { background: rgba(255,204,0,0.2); }

        /* ========== ОВЕРЛЕЙ ПОЛНОГО INCLUDE (ЦЕНТРИРОВАННЫЙ) ========== */
        #includeMoreOverlay .include-more-title {
            font-family: 'OldNewspaperTypes', sans-serif; font-size: 2rem; color: #f0fff8;
            text-transform: uppercase; margin-bottom: 1rem;
        }
        #includeMoreOverlay .include-full-list {
            list-style: none; padding: 0; display: flex; flex-direction: column; gap: 0.5rem;
            max-height: 60vh; overflow-y: auto; width: 100%; color: #f0fff8;
        }
        #includeMoreOverlay .include-full-list li {
            list-style: none; font-family: 'Press Start 2P', sans-serif; font-size: 0.7rem; color: #f0fff8;
            text-align: center; padding: 0; text-indent: 0;
        }
        #includeMoreOverlay .include-full-list li::before { content: none; }

        /* ========== НИЖНЯЯ ПАНЕЛЬ ========== */
        .bottom-bar { width: 100%; padding: 0; flex-shrink: 0; position: relative; z-index: 100; background: #ffffff; }
        .bottom-bar-inner { width: 100%; height: clamp(48px, 8vh, 64px); display: flex; align-items: center; justify-content: center; padding: 0 1rem; position: relative; gap: 2rem; }
        .bottom-social-link { text-decoration: none; font-family: 'Press Start 2P', sans-serif; font-size: clamp(0.5rem, 0.9vw, 0.65rem); letter-spacing: 0.3px; color: #700707; text-transform: uppercase; transition: color 0.2s ease; text-shadow: 0 0 8px rgba(112,7,7,0.4); }
        .bottom-social-link:hover { color: #990000; text-shadow: 0 0 14px rgba(153,0,0,0.6); }
        .mobile-social-btn { display: none; background: none; border: none; color: #700707; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; padding: 0.5rem 1rem; text-shadow: 0 0 8px rgba(112,7,7,0.4); transition: color 0.2s ease; }
        .mobile-social-btn:hover { color: #990000; }

        /* ========== АДАПТИВНОСТЬ ========== */
        @media (max-width: 768px) {
            .left-panel, .right-panel { width: clamp(30px, 6vw, 40px); }
            .nav, .more-toggle { display: none; }
            .mobile-menu-btn { display: block; }
            .page-content { padding: 1rem 0.5rem; }
            .shop-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; }
            .product-detail-card, .direct-fullscreen .direct-card { flex-direction: column; align-items: center; padding: 1.5rem; }
            .product-detail-image, .direct-fullscreen .direct-image { width: 70%; max-width: 250px; }
            .bottom-bar-inner { gap: 0; height: clamp(40px, 7vh, 48px); }
            .bottom-social-link { display: none; }
            .mobile-social-btn { display: block; }
            .agreement-box { padding: 2rem; }
            .agreement-box h3 { font-size: 1.5rem; }
            .btn-buy, .btn-get { font-size: 0.65rem; padding: 0.5rem 1.2rem; min-width: 80px; }
            .purchase-input { font-size: 0.65rem; }
            .product-detail-title { font-size: 1.4rem; }
            .purchased-item { flex-direction: column; align-items: flex-start; }
            .purchased-item-image { width: 80px; height: 80px; }
            .purchased-item-info { width: 100%; }
            .download-links-purchased { width: 100%; }
            .include-more-btn { font-size: 0.6rem; padding: 0.4rem 1rem; }
            .purchased-button {
                right: calc(clamp(30px, 6vw, 40px) + 20px);
                bottom: 70px;
            }
        }
        @media (max-width: 480px) {
            .left-panel, .right-panel { width: clamp(20px, 5vw, 28px); }
            .logo { height: clamp(24px, 4vh, 32px); }
            .shop-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
            .shop-item { padding: 0.5rem; border-radius: 8px; }
            .shop-item-image { margin-bottom: 0.3rem; border-radius: 6px; }
            .shop-item-title { font-size: 0.55rem; margin: 0.3rem 0; }
            .shop-item-price { font-size: 0.55rem; margin-bottom: 0.5rem; }
            .shop-item-controls { gap: 0.3rem; }
            .shop-item-action { font-size: 0.45rem; padding: 0.35rem 0.6rem; border-radius: 6px; }
            .code-input-wrapper .purchase-input-small { max-width: 120px; font-size: 0.45rem; }
            .product-detail-card, .direct-fullscreen .direct-card { padding: 0.8rem; gap: 0.8rem; }
            .product-detail-image, .direct-fullscreen .direct-image { width: 80%; max-width: 180px; }
            .btn-buy, .btn-get { font-size: 0.55rem; padding: 0.45rem 0.8rem; min-width: 65px; }
            .purchase-input { font-size: 0.55rem; padding: 0.4rem; width: 100%; }
            .buy-row { flex-wrap: wrap; gap: 0.4rem; }
            .product-detail-title { font-size: 1rem; }
            .purchased-item { padding: 0.8rem; gap: 0.8rem; }
            .purchased-item-image { width: 55px; height: 55px; }
            .purchased-item-title { font-size: 0.8rem; }
            .purchased-item-price { font-size: 0.65rem; }
            .purchased-item-include { font-size: 0.5rem; }
            .purchased-button {
                font-size: 0.45rem; padding: 0.4rem 0.8rem;
                bottom: 65px;
                right: calc(clamp(20px, 5vw, 28px) + 10px);
            }
            .include-more-btn { font-size: 0.5rem; padding: 0.3rem 0.7rem; }
            #includeMoreOverlay .include-more-title { font-size: 1.3rem; }
            #includeMoreOverlay .include-full-list li { font-size: 0.55rem; }
            .agreement-box { padding: 1.2rem; }
            .agreement-box h3 { font-size: 1.1rem; }
            .agreement-box p { font-size: 0.55rem; }
        }
    </style>
</head>
<body>

    <div class="main-content" id="mainContent">

        <div class="nav-overlay" id="navOverlay">

            <div class="nav-overlay-list" id="navOverlayList">
                <a href="discography.html"><span>DISCOGRAPHY</span></a>

                <a href="schedule.html"><span>SCHEDULE</span></a>

            </div>

        <!-- Верхняя панель -->

                <div class="agreement-check">

        <!-- Оверлей для полного списка Include (центрированный) -->

            <canvas class="overlay-bg-canvas" id="includeMoreBgCanvas"></canvas>
            <button class="close-overlay-btn" id="closeIncludeMoreOverlay">✕</button>
            <div class="product-detail-card" style="display:flex; flex-direction:column; align-items:center; gap:1rem;">
                <h3 class="include-more-title">Include</h3>

        </div></div>
    </div>
    <div class="right-panel"></div>

    <script src="shop-config.js"></script>
    <script>
        // ========== ПОЛНЫЙ СКРИПТ (без изменений) ==========
        (function() {
            // ---------- ГЛОБАЛЬНЫЙ ФОН ----------
            const globalCanvas = document.getElementById('globalBgCanvas');
            const ctx = globalCanvas.getContext('2d');
            const blobs = Array.from({length:6}, () => ({ x: 0.1+Math.random()*0.8, y: 0.1+Math.random()*0.8, r: 0.12+Math.random()*0.28 }));

            function drawGlobalBg() {
                const w = globalCanvas.width = window.innerWidth;
                const h = globalCanvas.height = window.innerHeight;
                ctx.clearRect(0,0,w,h);
                ctx.globalCompositeOperation = 'lighter';
                blobs.forEach(b => {
                    const cx = b.x * w, cy = b.y * h, maxR = b.r * Math.max(w,h);
                    const grad = ctx.createRadialGradient(cx,cy,maxR*0.2,cx,cy,maxR);
                    grad.addColorStop(0,'rgba(180,182,186,0.3)');
                    grad.addColorStop(0.2,'rgba(160,162,166,0.25)');
                    grad.addColorStop(0.4,'rgba(140,142,146,0.15)');
                    grad.addColorStop(0.7,'rgba(120,122,126,0.05)');
                    grad.addColorStop(1,'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx,cy,maxR,0,Math.PI*2);
                    ctx.fill();
                });
                ctx.globalCompositeOperation = 'source-over';
            }
            window.addEventListener('resize', drawGlobalBg);
            drawGlobalBg();

            function copyBgToOverlay(canvas) {
                if (!canvas) return;
                const c = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                c.drawImage(globalCanvas, 0, 0);
            }

            // ---------- ЗУМ ----------
            window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
            window.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && (e.key==='+'||e.key==='-'||e.key==='0')) e.preventDefault(); });
            document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

            // ---------- ИНДИКАТОР ЗАГРУЗКИ ----------
            const loadingEl = document.getElementById('loadingIndicator');
            let dots = 0;
            const loadingInterval = setInterval(() => {
                dots = (dots+1)%4;
                loadingEl.textContent = 'Loading' + '.'.repeat(dots);
            }, 500);

            // ---------- СОГЛАШЕНИЕ ----------
            const AGREEMENT_KEY = 'callbybreath_agreed';
            let pendingPurchaseAction = null;

            function showAgreementOverlay(actionCallback) {
                const overlay = document.getElementById('agreementOverlay');
                const checkbox = document.getElementById('agreementCheckbox');
                const btn = document.getElementById('btnAgree');
                checkbox.checked = false;
                btn.disabled = true;
                overlay.classList.add('open');
                pendingPurchaseAction = actionCallback;
            }

            document.getElementById('agreementCheckbox').addEventListener('change', function() {
                document.getElementById('btnAgree').disabled = !this.checked;
            });

            document.getElementById('btnAgree').addEventListener('click', function() {
                localStorage.setItem(AGREEMENT_KEY, 'true');
                document.getElementById('agreementOverlay').classList.remove('open');
                if (pendingPurchaseAction) {
                    pendingPurchaseAction();
                    pendingPurchaseAction = null;
                }
            });

            function hasAgreed() { return localStorage.getItem(AGREEMENT_KEY) === 'true'; }

            // ---------- ЗАКРЫТИЕ ОВЕРЛЕЕВ ----------
            function closeAllOverlays() {
                ['moreOverlay','socialOverlay','navOverlay'].forEach(id => document.getElementById(id).classList.remove('open'));
                const mb = document.getElementById('mobileMenuBtn');
                if (mb) { mb.classList.remove('open'); mb.textContent = '☰'; }
                document.getElementById('productDetailOverlay').classList.remove('open');
                document.getElementById('productDetailCard').innerHTML = '';
                document.getElementById('downloadOverlay').classList.remove('open');
                document.getElementById('downloadCard').innerHTML = '';
                document.getElementById('agreementOverlay').classList.remove('open');
                document.getElementById('includeMoreOverlay').classList.remove('open');
            }

            // ---------- НАВИГАЦИЯ ----------
            document.getElementById('moreToggle').addEventListener('click', e => {
                e.stopPropagation();
                const ov = document.getElementById('moreOverlay');
                ov.classList.toggle('open');
                if (ov.classList.contains('open')) copyBgToOverlay(document.getElementById('moreBgCanvas'));
            });
            document.getElementById('closeMoreOverlay').addEventListener('click', () => document.getElementById('moreOverlay').classList.remove('open'));

            document.getElementById('mobileSocialBtn').addEventListener('click', e => {
                e.stopPropagation();
                const ov = document.getElementById('socialOverlay');
                ov.classList.toggle('open');
                if (ov.classList.contains('open')) copyBgToOverlay(document.getElementById('socialBgCanvas'));
            });
            document.getElementById('closeSocialOverlay').addEventListener('click', () => document.getElementById('socialOverlay').classList.remove('open'));

            document.getElementById('mobileMenuBtn').addEventListener('click', () => {
                const ov = document.getElementById('navOverlay');
                ov.classList.toggle('open');
                document.getElementById('mobileMenuBtn').classList.toggle('open');
                document.getElementById('mobileMenuBtn').textContent = ov.classList.contains('open') ? '✕' : '☰';
                if (ov.classList.contains('open')) copyBgToOverlay(document.getElementById('navBgCanvas'));
            });
            document.getElementById('closeNavOverlay').addEventListener('click', () => {
                document.getElementById('navOverlay').classList.remove('open');
                document.getElementById('mobileMenuBtn').classList.remove('open');
                document.getElementById('mobileMenuBtn').textContent = '☰';
            });

            document.querySelectorAll('.more-overlay, .social-overlay, .nav-overlay').forEach(o => {
                o.addEventListener('click', function(e) { if (e.target === this) closeAllOverlays(); });
            });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAllOverlays(); });

            // ---------- СОЦИАЛЬНЫЕ ССЫЛКИ ----------
            const socialLinks = [
                { name:'youtube', url:'https://www.youtube.com/@CallbyBreath' },
                { name:'instagram', url:'https://www.instagram.com/callbybreath.official' },
                { name:'pinterest', url:'https://pinterest.com/callbybreath' },
                { name:'telegram', url:'https://t.me/callbybreath' },
                { name:'spotify', url:'https://open.spotify.com/artist/4RJTPseEgwmAZIto7YDuV6' },
                { name:'apple music', url:'https://music.apple.com/ru/artist/callbybreath/1602956679' },
                { name:'soundcloud', url:'https://soundcloud.com/callbybreath' }
            ];
            const bottomSocials = document.getElementById('bottomSocials');
            socialLinks.forEach(l => {
                const a = document.createElement('a'); a.className = 'bottom-social-link'; a.href = l.url; a.target = '_blank'; a.innerHTML = `<span>${l.name}</span>`;
                bottomSocials.appendChild(a);
            });
            const socialOverlayList = document.getElementById('socialOverlayList');
            socialLinks.forEach(l => {
                const a = document.createElement('a'); a.href = l.url; a.target = '_blank'; a.innerHTML = `<span>${l.name.toUpperCase()}</span>`;
                socialOverlayList.appendChild(a);
            });

            // ---------- PURCHASED ----------
            const STORAGE = 'callbybreath_purchased_v1';
            function loadPurchasedItems() { return JSON.parse(localStorage.getItem(STORAGE) || '[]'); }
            function savePurchasedItems(arr) { localStorage.setItem(STORAGE, JSON.stringify(arr)); }
            function isProductPurchased(name) { return loadPurchasedItems().some(i => i.name === name); }

            function getFreeProduct(product) {
                if (!hasAgreed()) { showAgreementOverlay(() => getFreeProduct(product)); return; }
                markAsPurchased(product.name);
                showDownloadLinks(product);
            }

            function markAsPurchased(name) {
                const items = loadPurchasedItems();
                if (items.some(i => i.name === name)) return;
                const product = products.find(p => p.name === name);
                if (product) {
                    const newItem = {
                        name: product.name, price: product.price, image: product.image,
                        include: product.include || [], downloadLinks: product.downloadLinks || {}
                    };
                    items.push(newItem);
                    savePurchasedItems(items);
                    updatePurchasedBadge();
                    renderShopGrid(currentSearch);
                }
            }

            function updatePurchasedBadge() {
                const count = loadPurchasedItems().length;
                document.getElementById('purchasedCount').textContent = count.toString();
            }

            let currentSearch = '';
            function showShopView() {
                document.getElementById('shopView').classList.remove('hidden');
                document.getElementById('purchasedView').classList.remove('active');
                updatePurchasedBadge();

                    return `<ul class="${ulClass}"><h4>Include:</h4>${firstTwo}<li class="include-more-li"><button class="include-more-btn" data-include-list="${encoded}">More (${includeArray.length})</button></li></ul>`;

                if (saveBtn) {
                    saveBtn.addEventListener('click', () => {
                        const purchased = loadPurchasedItems();
                        if (purchased.length === 0) return;
                        const json = JSON.stringify(purchased);
                        const key = 'C4llByBr3@th2025!';
                        let encrypted = '';
                        for (let i = 0; i < json.length; i++) encrypted += String.fromCharCode(json.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                        const blob = new Blob([btoa(encrypted)], { type: 'application/octet-stream' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = 'purchases.callbybreath.purchases'; a.click();
                        URL.revokeObjectURL(url);
                    });
                }
                if (loadBtn && fileInput) {
                    loadBtn.addEventListener('click', () => { if (!hasAgreed()) showAgreementOverlay(() => fileInput.click()); else fileInput.click(); });
                    fileInput.addEventListener('change', () => {
                        const file = fileInput.files[0]; if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            try {
                                const encrypted = atob(e.target.result);
                                const key = 'C4llByBr3@th2025!';
                                let json = '';
                                for (let i = 0; i < encrypted.length; i++) json += String.fromCharCode(encrypted.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                                const loaded = JSON.parse(json);
                                const current = loadPurchasedItems();
                                const merged = [...current];
                                loaded.forEach(li => { if (!merged.some(i => i.name === li.name)) merged.push(li); });
                                savePurchasedItems(merged);

                container.querySelectorAll('.purchased-item').forEach(el => {

                    p.textContent = symbols[Math.floor(Math.random()*symbols.length)];
                    p.style.left = e.clientX+'px'; p.style.top = e.clientY+'px';
                    p.style.color = Math.random()>0.5 ? '#f0fff8' : '#ffcc00';
                    const a = (Math.PI*2*i)/6, d = 15+Math.random()*25;
                    p.style.setProperty('--dx', Math.cos(a)*d+'px'); p.style.setProperty('--dy', Math.sin(a)*d+'px');
                    document.body.appendChild(p); setTimeout(() => p.remove(), 800);
                }
            }
            function attachParticles(sel) { document.querySelectorAll(sel).forEach(e => e.addEventListener('mouseenter', spawnParticles)); }
            function makeWobbly(sel) {
                document.querySelectorAll(sel).forEach(el => {
                    if (el.classList.contains('watch-btn') || el.closest('.watch-btn') || el.classList.contains('wobbly-done')) return;
                    el.classList.add('wobbly-done','wobbly-text');
                    const text = el.textContent; el.textContent = '';
                    [...text].forEach(c => {
                        const s = document.createElement('span'); s.className = 'char';
                        s.textContent = c===' ' ? '\u00A0' : c;
                        s.style.setProperty('--wx', (Math.random()-0.5)*3+'px'); s.style.setProperty('--wy', (Math.random()-0.5)*3+'px'); s.style.setProperty('--wr', (Math.random()-0.5)*4+'deg');
                        el.appendChild(s);
                    });
                });
            }
            setTimeout(() => {
                makeWobbly('.nav a'); makeWobbly('.more-toggle'); makeWobbly('.bottom-social-link');
                makeWobbly('.more-overlay-list a'); makeWobbly('.nav-overlay-list a'); makeWobbly('.mobile-social-btn'); makeWobbly('.social-overlay-list a');
                attachParticles('.nav a'); attachParticles('.more-toggle'); attachParticles('.bottom-social-link');
                attachParticles('.more-overlay-list a'); attachParticles('.nav-overlay-list a'); attachParticles('.mobile-social-btn'); attachParticles('.social-overlay-list a');
                attachParticles('.logo');
                loadingEl.classList.add('hidden'); clearInterval(loadingInterval);
            }, 3000);

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            updatePurchasedBadge();
        })();
    </script>
</body>
</html>
