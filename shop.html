<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>callbybreath official website – Shop</title>
    <link rel="icon" type="image/png" href="Images/logo.png">
    <style>
        /* ========== ШРИФТЫ ========== */
        @font-face { font-family: 'Press Start 2P'; src: url('Font/PressStart2P.ttf') format('truetype'); font-weight: normal; font-style: normal; }
        @font-face { font-family: 'Rubik Spray Paint'; src: url('Font/RubikSprayPaint-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; height: 100%; overflow: hidden; }
        body {
            font-family: 'Press Start 2P', sans-serif;
            color: #1f2024;
            line-height: 1.5;
            display: flex;
            flex-direction: row;
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
            background: #141416;
        }
        img { -webkit-user-drag: none; -khtml-user-drag: none; -moz-user-drag: none; -o-user-drag: none; user-drag: none; pointer-events: auto; }

        /* ========== ДЕКОРАТИВНЫЕ ЧАСТИЦЫ И СЛЕД ========== */
        .particle { position: fixed; pointer-events: none; z-index: 9999; font-size: 1.2rem; animation: particleFade 0.8s ease-out forwards; font-family: 'Press Start 2P', sans-serif; }
        @keyframes particleFade { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(0.3); } }
        .cursor-trail { position: fixed; pointer-events: none; z-index: 10000; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.6); box-shadow: 0 0 6px rgba(255,255,255,0.4); animation: trailFade 0.6s ease-out forwards; }
        @keyframes trailFade { 0% { opacity: 0.8; transform: scale(1); } 100% { opacity: 0; transform: scale(0); } }

        /* ========== ВОББЛИ-ТЕКСТ ========== */
        .wobbly-text { display: inline-block; }
        .wobbly-text .char { display: inline-block; transition: transform 0.25s ease-out, filter 0.25s ease-out; position: relative; z-index: 1; }
        .wobbly-text:hover .char { z-index: 2; transform: translate(var(--wx), var(--wy)) rotate(var(--wr)); filter: brightness(1.5); }

        /* ========== ОВЕРЛЕИ НАВИГАЦИИ ========== */
        .more-overlay, .social-overlay, .nav-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #141416;
            z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(1.5rem, 3vh, 2.5rem);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            overflow: hidden;
        }
        .more-overlay.open, .social-overlay.open, .nav-overlay.open { opacity: 1; pointer-events: auto; }
        .overlay-bg-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .overlay-close-btn {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: none; color: #f0fff8;
            font-size: 2rem; cursor: pointer; z-index: 20;
            line-height: 1; transition: color 0.2s;
        }
        .overlay-close-btn:hover { color: #ffcc00; }
        .more-overlay-title, .social-overlay-title, .nav-overlay-title {
            font-family: 'Rubik Spray Paint', sans-serif; font-size: clamp(1.5rem, 3vw, 2.5rem);
            color: #f0fff8; text-transform: uppercase; letter-spacing: 5px; opacity: 0.9;
            margin-bottom: 1rem; position: relative; z-index: 2; text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .more-overlay-list, .social-overlay-list, .nav-overlay-list {
            display: flex; flex-direction: column; gap: clamp(0.8rem, 1.5vh, 1.2rem); min-width: 250px;
            position: relative; z-index: 2;
        }
        .more-overlay-list a, .social-overlay-list a, .nav-overlay-list a {
            display: flex; align-items: center; justify-content: center; gap: 0.8rem;
            padding: clamp(1rem, 2vh, 1.5rem) clamp(1.5rem, 3vw, 2.5rem);
            color: #f0fff8; text-decoration: none; font-family: 'Press Start 2P', sans-serif;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem); letter-spacing: 2px; border-radius: 10px;
            transition: color 0.2s ease; text-transform: uppercase; text-align: center;
            text-shadow: 0 0 12px rgba(0,0,0,0.5), 0 2px 4px rgba(0,0,0,0.6);
        }
        .more-overlay-list a:hover, .social-overlay-list a:hover, .nav-overlay-list a:hover { color: #ffcc00; }

        /* ========== ГЛОБАЛЬНЫЙ ФОН ========== */
        #globalBgCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }

        /* ========== БЕЛЫЕ БОКОВЫЕ ПАНЕЛИ ========== */
        .left-panel, .right-panel { width: clamp(40px, 5vw, 64px); flex-shrink: 0; height: 100vh; position: relative; z-index: 5; background: #ffffff; }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; z-index: 10; height: 100%; }

        /* ========== ВЕРХНЯЯ ПАНЕЛЬ НАВИГАЦИИ ========== */
        .top-bar { width: 100%; padding: 0; flex-shrink: 0; position: relative; z-index: 100; background: #ffffff; }
        .top-bar-inner { width: 100%; height: clamp(48px, 8vh, 64px); display: flex; align-items: center; justify-content: space-between; padding: 0; position: relative; }
        .logo-wrapper { position: relative; display: inline-block; padding-left: 0.5rem; }
        .logo { height: clamp(36px, 6vh, 48px); width: auto; display: block; cursor: pointer; filter: brightness(0) saturate(100%) invert(10%) sepia(78%) saturate(4617%) hue-rotate(350deg) brightness(92%) contrast(108%); transition: transform 0.2s ease; }
        .logo:hover { transform: scale(1.05); }
        .nav { display: flex; gap: 1.2rem; align-items: center; padding-right: 0; }
        .nav a { text-decoration: none; font-size: 0.7rem; letter-spacing: 0.3px; color: #700707; transition: color 0.2s; padding: 0.5rem 0.8rem; border-radius: 10px; text-shadow: 0 0 6px rgba(112,7,7,0.3); }
        .nav a:last-child { padding-right: 0.5rem; }
        .nav a:hover { color: #990000; text-shadow: 0 0 10px rgba(153,0,0,0.5); }
        .more-toggle { text-decoration: none; font-size: 0.7rem; letter-spacing: 0.3px; color: #700707; transition: color 0.2s; padding: 0.5rem 0.8rem; cursor: pointer; background: none; border: none; border-radius: 10px; font-family: 'Press Start 2P', sans-serif; outline: none; -webkit-tap-highlight-color: transparent; text-shadow: 0 0 6px rgba(112,7,7,0.3); }
        .more-toggle:focus { outline: none; }
        .more-toggle:hover { color: #990000; text-shadow: 0 0 10px rgba(153,0,0,0.5); }
        .mobile-menu-btn { display: none; background: transparent; border: none; color: #700707; font-size: 1.8rem; cursor: pointer; padding: 0 0.5rem 0 0; line-height: 1; transition: color 0.2s, transform 0.3s ease; }
        .mobile-menu-btn:hover { color: #4a0000; }
        .mobile-menu-btn.open { transform: rotate(90deg); }

        /* ========== КОНТЕНТ СТРАНИЦЫ ========== */
        .page-content {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            scrollbar-width: none; -ms-overflow-style: none;
            padding: 1rem clamp(0.5rem, 2vw, 1.5rem);
            display: flex; flex-direction: column; align-items: center;
            position: relative; background: transparent;
        }
        .page-content::-webkit-scrollbar { display: none; }

        /* ========== ИНДИКАТОР ЗАГРУЗКИ ========== */
        #loadingIndicator {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: #000; color: #fff; font-family: 'Press Start 2P', sans-serif;
            font-size: 0.4rem; padding: 4px 8px; border-radius: 3px;
            opacity: 1; transition: opacity 0.4s ease; white-space: nowrap;
        }
        #loadingIndicator.hidden { opacity: 0; pointer-events: none; }

        /* ========== АНИМАЦИЯ ПОЯВЛЕНИЯ ========== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up { animation: fadeInUp 0.6s ease forwards; }

        /* ========== ЗАГОЛОВОК МАГАЗИНА ========== */
        .shop-title {
            font-family: 'Rubik Spray Paint', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            color: #f0fff8; text-transform: uppercase; letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0,0,0,0.7), 0 0 40px rgba(0,0,0,0.5);
            margin: 1.5rem 0 1.5rem;
            opacity: 0;
        }

        /* ========== КНОПКА "GET PURCHASE" ========== */
        .get-purchase-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #ffcc00;
            color: #141416;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.65rem;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 10px rgba(255,200,40,0.6);
        }
        .get-purchase-btn:hover {
            background: #ffaa00;
            box-shadow: 0 0 20px rgba(255,200,40,0.9);
        }

        /* ========== ОВЕРЛЕЙ ПОЛУЧЕНИЯ ПОКУПКИ (ВО ВСЮ ОБЛАСТЬ КОНТЕНТА) ========== */
        .purchase-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #141416;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            overflow-y: auto;
            padding: 2rem clamp(0.5rem, 2vw, 1.5rem);
        }
        .purchase-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .purchase-overlay .close-overlay-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: #f0fff8;
            font-size: 2rem;
            cursor: pointer;
            z-index: 20;
            line-height: 1;
            transition: color 0.2s;
        }
        .purchase-overlay .close-overlay-btn:hover { color: #ffcc00; }

        .purchase-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .purchase-form h3 {
            font-family: 'Rubik Spray Paint', sans-serif;
            font-size: 1.3rem;
            color: #ffcc00;
            margin-bottom: 0.5rem;
        }
        .purchase-input {
            padding: 0.6rem;
            background: #1f2024;
            border: 2px solid rgba(255,230,200,0.6);
            border-radius: 8px;
            color: #f0fff8;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem;
            outline: none;
            text-align: center;
            width: 300px;
            max-width: 100%;
        }
        .purchase-submit {
            background: #ffcc00;
            color: #141416;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem;
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .purchase-submit:hover { background: #ffaa00; }
        .purchase-error {
            color: #ff4444;
            font-size: 0.6rem;
            min-height: 1.2em;
        }

        /* ========== РЕЗУЛЬТАТ (ТОВАР + ССЫЛКИ) ========== */
        .purchase-result {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            text-align: center;
        }
        .purchase-result.visible {
            display: flex;
        }
        .purchase-product-card {
            background: rgba(20,20,22,0.9);
            border: 2px solid rgba(255,230,200,0.7);
            border-radius: 10px;
            padding: 1rem;
            width: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .purchase-product-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            background: #141416;
        }
        .purchase-product-card .product-title {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.6rem;
            color: #f0fff8;
            text-transform: uppercase;
        }
        .purchase-product-card .product-price {
            font-size: 0.7rem;
            color: #ffcc00;
            margin-top: 0.5rem;
        }
        .purchase-download-links {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }
        .purchase-download-links a {
            color: #ffcc00;
            text-decoration: underline;
            font-size: 0.65rem;
            transition: color 0.2s;
        }
        .purchase-download-links a:hover { color: #fff; }

        /* ========== СЕТКА ТОВАРОВ ========== */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 2rem;
        }
        .shop-item {
            background: rgba(20,20,22,0.9);
            border: 2px solid rgba(255,230,200,0.7);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: box-shadow 0.3s, border-color 0.3s;
            opacity: 0;
        }
        .shop-item.visible { opacity: 1; }
        .shop-item:hover {
            border-color: #ffcc00;
            box-shadow: 0 0 15px rgba(255,200,40,0.5);
        }
        .shop-item-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: #141416;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .shop-item-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .shop-item-title {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.6rem;
            color: #f0fff8;
            margin: 0.5rem 0;
            text-transform: uppercase;
            word-break: break-word;
        }
        .shop-item-price {
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.7rem;
            color: #ffcc00;
            margin-bottom: 1rem;
        }
        .shop-item-buy {
            background: #ffcc00;
            color: #141416;
            font-family: 'Press Start 2P', sans-serif;
            font-size: 0.6rem;
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            text-transform: uppercase;
            display: inline-block;
        }
        .shop-item-buy:hover { background: #ffaa00; }

        /* ========== НИЖНЯЯ ПАНЕЛЬ ========== */
        .bottom-bar { width: 100%; padding: 0; flex-shrink: 0; position: relative; z-index: 100; background: #ffffff; }
        .bottom-bar-inner { width: 100%; height: clamp(48px, 8vh, 64px); display: flex; align-items: center; justify-content: center; padding: 0 1rem; position: relative; gap: 2rem; }
        .bottom-social-link { text-decoration: none; font-family: 'Press Start 2P', sans-serif; font-size: clamp(0.5rem, 0.9vw, 0.65rem); letter-spacing: 0.3px; color: #700707; text-transform: uppercase; transition: color 0.2s ease; text-shadow: 0 0 8px rgba(112,7,7,0.4); }
        .bottom-social-link:hover { color: #990000; text-shadow: 0 0 14px rgba(153,0,0,0.6); }
        .mobile-social-btn { display: none; background: none; border: none; color: #700707; font-family: 'Press Start 2P', sans-serif; font-size: 0.6rem; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; padding: 0.5rem 1rem; text-shadow: 0 0 8px rgba(112,7,7,0.4); transition: color 0.2s ease; }
        .mobile-social-btn:hover { color: #990000; }

        /* ========== АДАПТИВНОСТЬ ========== */
        @media (max-width: 768px) {
            .left-panel, .right-panel { width: clamp(30px, 6vw, 40px); }
            .nav, .more-toggle { display: none; }
            .mobile-menu-btn { display: block; }
            .page-content { padding: 1rem 0.5rem; }
            .get-purchase-btn {
                font-size: 0.55rem;
                padding: 0.5rem 1rem;
                top: 0.8rem;
                right: 0.8rem;
            }
            .shop-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .bottom-bar-inner { gap: 0; height: clamp(40px, 7vh, 48px); }
            .bottom-social-link { display: none; }
            .mobile-social-btn { display: block; }
            .purchase-overlay {
                padding: 1rem 0.5rem;
            }
        }
        @media (max-width: 480px) {
            .left-panel, .right-panel { width: clamp(24px, 5vw, 32px); }
            .logo { height: clamp(28px, 4vh, 36px); }
            .shop-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Глобальный фоновый canvas -->
    <canvas id="globalBgCanvas"></canvas>

    <!-- Боковые панели -->
    <div class="left-panel"></div>
    <div class="main-content" id="mainContent">
        <!-- Оверлей "More" -->
        <div class="more-overlay" id="moreOverlay">
            <canvas class="overlay-bg-canvas" id="moreBgCanvas"></canvas>
            <button class="overlay-close-btn" id="closeMoreOverlay">✕</button>
            <div class="more-overlay-title">More</div>
            <div class="more-overlay-list">
                <a href="archive.html"><span>ARCHIVE</span></a>
                <a href="schedule.html"><span>SCHEDULE</span></a>
                <a href="special.html"><span>SPECIAL</span></a>
            </div>
        </div>
        <!-- Оверлей "Social" -->
        <div class="social-overlay" id="socialOverlay">
            <canvas class="overlay-bg-canvas" id="socialBgCanvas"></canvas>
            <button class="overlay-close-btn" id="closeSocialOverlay">✕</button>
            <div class="social-overlay-title">Social</div>
            <div class="social-overlay-list" id="socialOverlayList"></div>
        </div>
        <!-- Оверлей "Menu" (мобильная навигация) -->
        <div class="nav-overlay" id="navOverlay">
            <canvas class="overlay-bg-canvas" id="navBgCanvas"></canvas>
            <button class="overlay-close-btn" id="closeNavOverlay">✕</button>
            <div class="nav-overlay-title">Menu</div>
            <div class="nav-overlay-list" id="navOverlayList">
                <a href="discography.html"><span>DISCOGRAPHY</span></a>
                <a href="videos.html"><span>MUSIC VIDEOS</span></a>
                <a href="shop.html"><span>SHOP</span></a>
                <a href="schedule.html"><span>SCHEDULE</span></a>
                <a href="archive.html"><span>ARCHIVE</span></a>
                <a href="special.html"><span>SPECIAL</span></a>
            </div>
        </div>

        <!-- Верхняя панель -->
        <div class="top-bar"><div class="top-bar-inner">
            <div class="logo-wrapper"><a href="index.html"><img src="Images/logo.png" alt="CallbyBreath" class="logo" id="logoImg"></a></div>
            <nav class="nav">
                <a href="discography.html"><span>DISCOGRAPHY</span></a>
                <a href="videos.html"><span>MUSIC VIDEOS</span></a>
                <a href="shop.html"><span>SHOP</span></a>
                <button class="more-toggle" id="moreToggle"><span>MORE</span></button>
            </nav>
            <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        </div></div>

        <!-- Контент магазина -->
        <div class="page-content" id="pageContent">
            <div id="loadingIndicator">Loading</div>

            <!-- Кнопка "Get purchase" (в правом верхнем углу) -->
            <button class="get-purchase-btn" id="getPurchaseBtn">Get purchase</button>

            <h1 class="shop-title fade-in-up" style="animation-delay: 0.2s">SHOP</h1>

            <!-- Сетка товаров будет заполнена скриптом -->
            <div class="shop-grid" id="shopGrid"></div>
        </div>

        <!-- Оверлей получения покупки (занимает всю область контента) -->
        <div class="purchase-overlay" id="purchaseOverlay">
            <button class="close-overlay-btn" id="closePurchaseOverlay">✕</button>

            <!-- Форма ввода кода (изначально видна) -->
            <div class="purchase-form" id="purchaseForm">
                <h3>Enter purchase code</h3>
                <input type="text" class="purchase-input" id="purchaseCodeInput" placeholder="XXXX-XXXX-XXXX">
                <button class="purchase-submit" id="purchaseSubmitBtn">Submit</button>
                <div class="purchase-error" id="purchaseError"></div>
            </div>

            <!-- Результат: карточка товара + ссылки (изначально скрыт) -->
            <div class="purchase-result" id="purchaseResult">
                <div class="purchase-product-card" id="purchaseProductCard"></div>
                <div class="purchase-download-links" id="purchaseDownloadLinks" style="display: none;"></div>
            </div>
        </div>

        <!-- Нижняя панель -->
        <div class="bottom-bar"><div class="bottom-bar-inner" id="bottomSocials">
            <button class="mobile-social-btn" id="mobileSocialBtn">SOCIAL</button>
        </div></div>
    </div>
    <div class="right-panel"></div>

    <!-- Подключаем конфигурацию товаров -->
    <script src="shop-config.js"></script>

    <!-- Основной скрипт -->
    <script>
        (function() {
            // ========== ГЛОБАЛЬНЫЙ ФОН ==========
            const globalCanvas = document.getElementById('globalBgCanvas');
            const ctx = globalCanvas.getContext('2d');
            const blobs = Array.from({length:6}, () => ({ x: 0.1+Math.random()*0.8, y: 0.1+Math.random()*0.8, r: 0.12+Math.random()*0.28 }));

            function drawGlobalBg() {
                const w = globalCanvas.width = window.innerWidth;
                const h = globalCanvas.height = window.innerHeight;
                ctx.clearRect(0,0,w,h);
                ctx.globalCompositeOperation = 'lighter';
                blobs.forEach(b => {
                    const cx = b.x * w, cy = b.y * h, maxR = b.r * Math.max(w,h);
                    const grad = ctx.createRadialGradient(cx,cy,maxR*0.2,cx,cy,maxR);
                    grad.addColorStop(0,'rgba(180,182,186,0.3)');
                    grad.addColorStop(0.2,'rgba(160,162,166,0.25)');
                    grad.addColorStop(0.4,'rgba(140,142,146,0.15)');
                    grad.addColorStop(0.7,'rgba(120,122,126,0.05)');
                    grad.addColorStop(1,'rgba(0,0,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(cx,cy,maxR,0,Math.PI*2);
                    ctx.fill();
                });
                ctx.globalCompositeOperation = 'source-over';
            }
            window.addEventListener('resize', drawGlobalBg);
            drawGlobalBg();

            // Копирование фона в оверлеи
            function copyBgToOverlay(overlayCanvas) {
                if (!overlayCanvas) return;
                const oCtx = overlayCanvas.getContext('2d');
                overlayCanvas.width = window.innerWidth;
                overlayCanvas.height = window.innerHeight;
                oCtx.drawImage(globalCanvas, 0, 0, overlayCanvas.width, overlayCanvas.height);
            }

            // ========== ИНДИКАТОР ЗАГРУЗКИ ==========
            const loadingEl = document.getElementById('loadingIndicator');
            let loadingDots = 0;
            const loadingInterval = setInterval(() => {
                loadingDots = (loadingDots + 1) % 4;
                loadingEl.textContent = 'Loading' + '.'.repeat(loadingDots);
            }, 500);

            // ========== ОТКЛЮЧЕНИЕ ЗУМА И КОПИРОВАНИЯ ==========
            window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
            window.addEventListener('keydown', e => { if ((e.ctrlKey||e.metaKey) && (e.key==='+'||e.key==='-'||e.key==='0')) e.preventDefault(); });

            // ========== ЗАКРЫТИЕ ВСЕХ ОВЕРЛЕЕВ ==========
            function closeAllOverlays() {
                ['moreOverlay','socialOverlay','navOverlay'].forEach(id => {
                    document.getElementById(id).classList.remove('open');
                });
                const menuBtn = document.getElementById('mobileMenuBtn');
                if (menuBtn) {
                    menuBtn.classList.remove('open');
                    menuBtn.textContent = '☰';
                }
                document.getElementById('purchaseOverlay').classList.remove('open');
            }

            // ========== ОБРАБОТЧИКИ ОВЕРЛЕЕВ НАВИГАЦИИ ==========
            document.getElementById('moreToggle').addEventListener('click', e => {
                e.stopPropagation();
                const overlay = document.getElementById('moreOverlay');
                overlay.classList.toggle('open');
                if (overlay.classList.contains('open')) copyBgToOverlay(document.getElementById('moreBgCanvas'));
            });
            document.getElementById('closeMoreOverlay').addEventListener('click', () => {
                document.getElementById('moreOverlay').classList.remove('open');
            });

            document.getElementById('mobileSocialBtn').addEventListener('click', e => {
                e.stopPropagation();
                const overlay = document.getElementById('socialOverlay');
                overlay.classList.toggle('open');
                if (overlay.classList.contains('open')) copyBgToOverlay(document.getElementById('socialBgCanvas'));
            });
            document.getElementById('closeSocialOverlay').addEventListener('click', () => {
                document.getElementById('socialOverlay').classList.remove('open');
            });

            document.getElementById('mobileMenuBtn').addEventListener('click', () => {
                const overlay = document.getElementById('navOverlay');
                overlay.classList.toggle('open');
                document.getElementById('mobileMenuBtn').classList.toggle('open');
                document.getElementById('mobileMenuBtn').textContent = overlay.classList.contains('open') ? '✕' : '☰';
                if (overlay.classList.contains('open')) copyBgToOverlay(document.getElementById('navBgCanvas'));
            });
            document.getElementById('closeNavOverlay').addEventListener('click', () => {
                document.getElementById('navOverlay').classList.remove('open');
                document.getElementById('mobileMenuBtn').classList.remove('open');
                document.getElementById('mobileMenuBtn').textContent = '☰';
            });

            document.querySelectorAll('.more-overlay, .social-overlay, .nav-overlay').forEach(overlay => {
                overlay.addEventListener('click', function(e) {
                    if (e.target === this) closeAllOverlays();
                });
            });

            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeAllOverlays();
            });

            // ========== СОЦИАЛЬНЫЕ ССЫЛКИ ==========
            const socialLinks = [
                { name:'youtube', url:'https://www.youtube.com/@CallbyBreath' },
                { name:'instagram', url:'https://www.instagram.com/callbybreath.official' },
                { name:'pinterest', url:'https://pinterest.com/callbybreath' },
                { name:'telegram', url:'https://t.me/callbybreath' },
                { name:'spotify', url:'https://open.spotify.com/artist/4RJTPseEgwmAZIto7YDuV6' },
                { name:'apple music', url:'https://music.apple.com/ru/artist/callbybreath/1602956679' },
                { name:'soundcloud', url:'https://soundcloud.com/callbybreath' }
            ];
            const bottomSocials = document.getElementById('bottomSocials');
            socialLinks.forEach(l => {
                const a = document.createElement('a'); a.className = 'bottom-social-link'; a.href = l.url; a.target = '_blank'; a.innerHTML = `<span>${l.name}</span>`;
                bottomSocials.appendChild(a);
            });
            const socialOverlayList = document.getElementById('socialOverlayList');
            socialLinks.forEach(l => {
                const a = document.createElement('a'); a.href = l.url; a.target = '_blank'; a.innerHTML = `<span>${l.name.toUpperCase()}</span>`;
                socialOverlayList.appendChild(a);
            });

            // ======================== ТОВАРЫ ИЗ КОНФИГУРАЦИИ ========================
            const products = shopConfig && shopConfig.products ? shopConfig.products : [];

            const shopGrid = document.getElementById('shopGrid');
            shopGrid.innerHTML = '';

            // Создаём карточки товаров
            products.forEach((product, index) => {
                const item = document.createElement('div');
                item.className = 'shop-item fade-in-up';
                item.style.animationDelay = `${0.3 + index * 0.15}s`;

                // Изображение товара
                const imgDiv = document.createElement('div');
                imgDiv.className = 'shop-item-image';
                const img = document.createElement('img');
                img.src = product.image;
                img.alt = product.name;
                img.loading = 'lazy';
                imgDiv.appendChild(img);

                // Название товара
                const title = document.createElement('div');
                title.className = 'shop-item-title';
                title.textContent = product.name;

                // Цена
                const price = document.createElement('div');
                price.className = 'shop-item-price';
                price.textContent = product.price;

                // Кнопка BUY
                const buyBtn = document.createElement('a');
                buyBtn.className = 'shop-item-buy';
                buyBtn.textContent = 'BUY';
                buyBtn.href = '#';
                // Если указан buyLink, открываем его, иначе ничего не делаем
                if (product.buyLink) {
                    buyBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        window.open(product.buyLink, '_blank');
                    });
                } else {
                    buyBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        // ничего не происходит, можно оставить как заглушку
                    });
                }

                item.appendChild(imgDiv);
                item.appendChild(title);
                item.appendChild(price);
                item.appendChild(buyBtn);

                shopGrid.appendChild(item);
            });

            // ======================== ЛОГИКА "GET PURCHASE" ========================
            const purchaseOverlay = document.getElementById('purchaseOverlay');
            const purchaseForm = document.getElementById('purchaseForm');
            const purchaseCodeInput = document.getElementById('purchaseCodeInput');
            const purchaseSubmitBtn = document.getElementById('purchaseSubmitBtn');
            const purchaseError = document.getElementById('purchaseError');
            const purchaseResult = document.getElementById('purchaseResult');
            const purchaseProductCard = document.getElementById('purchaseProductCard');
            const purchaseDownloadLinks = document.getElementById('purchaseDownloadLinks');
            const getPurchaseBtn = document.getElementById('getPurchaseBtn');
            const closePurchaseOverlayBtn = document.getElementById('closePurchaseOverlay');

            // Открыть оверлей
            getPurchaseBtn.addEventListener('click', () => {
                purchaseOverlay.classList.add('open');
                purchaseCodeInput.value = '';
                purchaseError.textContent = '';
                purchaseForm.style.display = 'flex';
                purchaseResult.classList.remove('visible');
                purchaseDownloadLinks.style.display = 'none';
            });

            // Закрыть оверлей
            function closePurchaseOverlay() {
                purchaseOverlay.classList.remove('open');
            }
            closePurchaseOverlayBtn.addEventListener('click', closePurchaseOverlay);
            purchaseOverlay.addEventListener('click', (e) => {
                if (e.target === purchaseOverlay) closePurchaseOverlay();
            });

            // Проверка введённого кода
            purchaseSubmitBtn.addEventListener('click', () => {
                const enteredCode = purchaseCodeInput.value.trim();
                const matchedProduct = products.find(p => p.purchaseCode === enteredCode);

                if (matchedProduct) {
                    purchaseError.textContent = '';
                    purchaseForm.style.display = 'none';

                    // Заполняем карточку товара
                    purchaseProductCard.innerHTML = `
                        <img src="${matchedProduct.image}" alt="${matchedProduct.name}">
                        <div class="product-title">${matchedProduct.name}</div>
                        <div class="product-price">${matchedProduct.price}</div>
                    `;

                    // Строим ссылки (только те, что не пустые)
                    const links = matchedProduct.downloadLinks || {};
                    let linksHtml = '';
                    if (links.mega) linksHtml += `<a href="${links.mega}" target="_blank">Get on Mega</a>`;
                    if (links.googleDrive) linksHtml += `<a href="${links.googleDrive}" target="_blank">Get on Google Drive</a>`;
                    if (links.mediaFire) linksHtml += `<a href="${links.mediaFire}" target="_blank">Get on MediaFire</a>`;
                    if (links.yandexDisk) linksHtml += `<a href="${links.yandexDisk}" target="_blank">Get on Yandex Disk</a>`;

                    purchaseDownloadLinks.innerHTML = linksHtml;
                    purchaseDownloadLinks.style.display = linksHtml.trim() ? 'flex' : 'none';
                    purchaseResult.classList.add('visible');
                } else {
                    purchaseError.textContent = 'Invalid code. Try again.';
                    purchaseResult.classList.remove('visible');
                    purchaseDownloadLinks.style.display = 'none';
                }
            });

            // Закрытие оверлея по Escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && purchaseOverlay.classList.contains('open')) {
                    closePurchaseOverlay();
                }
            });

            // ========== ДЕКОРАТИВНЫЕ ЭФФЕКТЫ ==========
            let trailTimeout;
            document.addEventListener('mousemove', e => {
                if (trailTimeout) return;
                trailTimeout = setTimeout(() => {
                    trailTimeout = null;
                    const dot = document.createElement('div'); dot.className = 'cursor-trail';
                    dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px';
                    document.body.appendChild(dot); setTimeout(() => dot.remove(), 600);
                }, 50);
            });

            const particleSymbols = ['☆','✧','✦','★','⭑'];
            function spawnParticles(e) {
                for (let i=0; i<6; i++) {
                    const p = document.createElement('span'); p.className = 'particle';
                    p.textContent = particleSymbols[Math.floor(Math.random()*particleSymbols.length)];
                    p.style.left = e.clientX+'px'; p.style.top = e.clientY+'px';
                    p.style.color = Math.random()>0.5 ? '#f0fff8' : '#ffcc00';
                    const a = (Math.PI*2*i)/6, d = 15+Math.random()*25;
                    p.style.setProperty('--dx', Math.cos(a)*d+'px');
                    p.style.setProperty('--dy', Math.sin(a)*d+'px');
                    document.body.appendChild(p); setTimeout(() => p.remove(), 800);
                }
            }
            function attachParticles(sel) { document.querySelectorAll(sel).forEach(e => e.addEventListener('mouseenter', spawnParticles)); }
            function makeWobbly(sel) {
                document.querySelectorAll(sel).forEach(el => {
                    if (el.classList.contains('watch-btn') || el.closest('.watch-btn') || el.classList.contains('wobbly-done')) return;
                    el.classList.add('wobbly-done','wobbly-text');
                    const text = el.textContent; el.textContent = '';
                    [...text].forEach(c => {
                        const s = document.createElement('span'); s.className = 'char';
                        s.textContent = c===' ' ? '\u00A0' : c;
                        s.style.setProperty('--wx', (Math.random()-0.5)*3+'px');
                        s.style.setProperty('--wy', (Math.random()-0.5)*3+'px');
                        s.style.setProperty('--wr', (Math.random()-0.5)*4+'deg');
                        el.appendChild(s);
                    });
                });
            }

            setTimeout(() => {
                makeWobbly('.nav a'); makeWobbly('.more-toggle'); makeWobbly('.bottom-social-link');
                makeWobbly('.more-overlay-list a'); makeWobbly('.nav-overlay-list a'); makeWobbly('.mobile-social-btn'); makeWobbly('.social-overlay-list a');
                attachParticles('.nav a'); attachParticles('.more-toggle'); attachParticles('.bottom-social-link');
                attachParticles('.more-overlay-list a'); attachParticles('.nav-overlay-list a'); attachParticles('.mobile-social-btn'); attachParticles('.social-overlay-list a');
                attachParticles('.logo');
                loadingEl.classList.add('hidden');
                clearInterval(loadingInterval);
            }, 3000);

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
        })();
    </script>
</body>
</html>
