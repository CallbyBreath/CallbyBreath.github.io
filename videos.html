<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>callbybreath official website</title>
  <link rel="icon" type="image/png" href="Images/logo.png">
  <style>
    @font-face {
      font-family: 'Eitai';
      src: url('Font/Eitai.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'NotoSerifJP';
      src: url('Font/NotoSerifJP-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #f0fff8;
      font-family: 'Eitai', sans-serif;
      color: #1f2024;
      line-height: 1.5;
      display: flex;
      flex-direction: row;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: auto;
    }

    .left-panel, .right-panel {
      width: 64px;
      background-color: #1f2024;
      flex-shrink: 0;
      height: 100vh;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      background-color: #1f2024;
      width: 100%;
      padding: 0;
      flex-shrink: 0;
    }

    .top-bar-inner {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2rem;
      position: relative;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
    }

    .logo {
      height: 48px;
      width: auto;
      display: block;
      cursor: pointer;
      filter: brightness(0) invert(1);
    }

    .tooltip {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      background-color: #1f2024;
      color: #f0fff8;
      font-size: 0.8rem;
      font-weight: 340;
      padding: 8px 14px;
      white-space: nowrap;
      border-left: 2px solid #700707;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .logo-wrapper:hover .tooltip {
      opacity: 1;
      visibility: visible;
    }

    .nav {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .nav a {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 380;
      letter-spacing: 0.3px;
      color: #f0fff8;
      transition: color 0.2s;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .nav a:hover {
      color: #700707;
    }

    .nav a.active {
      color: #700707;
      border-bottom: 2px solid #700707;
    }

    .nav-separator {
      color: #f0fff8;
      font-size: 0.9rem;
      display: inline-block;
      transform: scaleX(0.65);
    }

    .news-ticker-header {
      width: 100%;
      background-color: #700707;
      padding: 0.4rem 0;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .news-ticker-header:hover {
      background-color: #1f2024;
    }

    .news-ticker-header .ticker-content-header {
      color: #f0fff8;
    }

    .news-ticker-header .news-badge-ticker {
      background-color: #f0fff8;
      color: #700707;
    }

    .news-ticker-header:hover .news-badge-ticker {
      background-color: #700707;
      color: #f0fff8;
    }

    .ticker-content-header {
      display: inline-block;
      animation: ticker-header 30s linear infinite;
      font-family: 'NotoSerifJP', serif;
      font-size: 0.9rem;
      font-weight: 300;
      text-transform: uppercase;
      padding-left: 20px;
    }

    .ticker-content-header span {
      margin-right: 40px;
    }

    .news-badge-ticker {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      margin: 0 10px;
      font-family: 'Eitai', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes ticker-header {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: #f0fff8;
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
      position: absolute;
      right: 2rem;
    }

    .mobile-menu-btn:hover {
      color: #700707;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      top: 64px;
      right: 0;
      background-color: #1f2024;
      padding: 1.5rem;
      flex-direction: column;
      gap: 1.2rem;
      z-index: 999;
      border-left: none;
      border-bottom: none;
      min-width: 200px;
    }

    .mobile-nav.active {
      display: flex;
    }

    .mobile-nav a {
      text-decoration: none;
      font-size: 1rem;
      font-weight: 380;
      letter-spacing: 0.3px;
      color: #f0fff8;
      transition: color 0.2s;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .mobile-nav a:hover {
      color: #700707;
    }

    .mobile-nav a.active {
      color: #700707;
      border-bottom: 2px solid #700707;
    }

    .page-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      display: flex;
      flex-direction: column;
    }

    .page-wrapper::-webkit-scrollbar {
      display: none;
    }

    .content-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 4rem 2rem 0 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: left;
    }

    .nav a .scale-wrapper,
    .tooltip .scale-wrapper,
    .coming-soon .scale-wrapper,
    .filter-btn .scale-wrapper,
    .mobile-nav a .scale-wrapper {
      transform-origin: center;
    }

    .nav a {
      display: inline-block;
    }

    .nav a .scale-wrapper {
      display: inline-block;
    }

    .mobile-nav a {
      display: block;
      text-align: center;
    }

    .mobile-nav a .scale-wrapper {
      display: inline-block;
    }

    .title-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .title-box {
      background-image: url('Images/background01_red.jpg');
      background-size: cover;
      background-position: center;
      width: 100%;
      max-width: 1600px;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }

    .page-title {
      font-size: 3rem;
      font-weight: 700;
      color: #700707;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      text-shadow: 
        -1px -1px 0 #f0fff8,
        1px -1px 0 #f0fff8,
        -1px 1px 0 #f0fff8,
        1px 1px 0 #f0fff8;
    }

    .page-title .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: center;
    }

    .page-subtitle {
      font-family: 'NotoSerifJP', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: #f0fff8;
      letter-spacing: 2px;
      display: inline-block;
      background-color: #700707;
      padding: 0.1rem 0.5rem;
      white-space: nowrap;
    }

    .page-subtitle .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.8);
      transform-origin: center;
    }

    .filters-wrapper {
      width: 100%;
      max-width: 1600px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
    }

    .filters-container {
      display: flex;
      gap: 0;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: #1f2024;
      font-family: 'Eitai', sans-serif;
      font-size: 1.125rem;
      font-weight: 400;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      padding: 0;
      transform: scaleX(0.65);
    }

    .filter-btn:hover {
      color: #700707;
    }

    .filter-btn.active {
      color: #700707;
    }

    .filter-separator {
      color: #1f2024;
      margin: 0 1.2rem;
      font-size: 1.125rem;
      transform: scaleX(0.65);
      display: inline-block;
    }

    .divider-line {
      width: 100%;
      max-width: 1600px;
      height: 1px;
      background-color: #1f2024;
      margin-bottom: 2rem;
    }

    /* Контейнер для видео */
    #videoTimeline {
      width: 100%;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .year-month-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 0 1rem 0;
      width: 100%;
    }

    .year-month-section:first-of-type {
      margin-top: 0;
    }

    .year-month-section:not(:first-of-type) {
      margin-top: 2rem;
    }

    .year-month-label {
      font-size: 0.55rem;
      font-weight: 400;
      color: #1f2024;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
      line-height: 1;
      transform: scaleX(0.65);
    }

    .year-month-header {
      font-size: 1.3rem;
      font-weight: 380;
      color: #700707;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      margin: 0 0 1rem 0;
      transform: scaleX(0.65);
      line-height: 1;
    }

    .year-month-header .year {
      font-weight: 600;
      color: #1f2024;
      margin-right: 0.5rem;
    }

    .year-month-header .month {
      font-weight: 400;
    }

    /* НОВАЯ СЕТКА ВИДЕО С АВТОМАТИЧЕСКИМ ЦЕНТРИРОВАНИЕМ */
    .video-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.8rem;
      width: 100%;
      max-width: 100%;
    }

    /* Карточка видео — фиксированная ширина */
    .video-card {
      display: flex;
      flex-direction: column;
      position: relative;
      text-align: center;
      width: 280px;
      flex-shrink: 0;
    }

    .video-card.hidden {
      display: none;
    }

    .video-date-top {
      font-size: 0.75rem;
      font-weight: 300;
      color: #1f2024;
      letter-spacing: 0.5px;
      font-family: 'NotoSerifJP', serif;
      text-align: center;
      margin-bottom: 12px;
    }

    .video-date-top .scale-wrapper {
      display: inline-block;
      transform-origin: center;
    }

    .video-thumb-link {
      display: block;
      text-decoration: none;
      position: relative;
      margin-bottom: 10px;
    }

    .video-thumb {
      aspect-ratio: 16 / 9;
      background-color: #1f2024;
      border: 1px solid #1f2024;
      overflow: hidden;
      width: 100%;
      transition: border-color 0.2s ease;
    }

    .video-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-thumb-link:hover .video-thumb {
      border-color: #700707;
    }

    .play-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background-color: #f0fff8;
      color: #1f2024;
      font-family: 'Eitai', sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      z-index: 5;
      line-height: 1;
      padding: 4px 8px;
      transform: scaleX(0.65);
      transform-origin: left;
    }

    .video-thumb.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coming-soon {
      color: #f0fff8;
      font-size: 1.1rem;
      font-weight: 320;
    }

    .coming-soon .scale-wrapper {
      display: inline-block;
    }

    .video-link-top {
      margin-bottom: 4px;
      text-align: center;
    }

    .video-link-top a {
      text-decoration: none;
      color: #1f2024;
      font-size: 0.8rem;
      font-weight: 300;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .video-link-top a:hover {
      color: #700707;
    }

    .video-link-top .arrow {
      font-size: 1rem;
      line-height: 1;
    }

    .video-link-top .link-text {
      font-family: 'NotoSerifJP', serif;
      transform: scaleX(0.65);
      display: inline-block;
      transform-origin: center;
    }

    .video-title {
      font-size: 1.2rem;
      font-weight: 300;
      color: #1f2024;
      line-height: 1.3;
      margin-bottom: 0;
      font-family: 'NotoSerifJP', serif;
      text-align: center;
      text-transform: uppercase;
      word-break: break-word;
    }

    .video-title .scale-wrapper {
      display: inline-block;
      transform-origin: center;
    }

    .tooltip .scale-wrapper {
      display: inline-block;
      white-space: nowrap;
    }

    .no-results {
      text-align: center;
      font-size: 1rem;
      color: #1f2024;
      margin-top: 2rem;
      transform: scaleX(0.65);
      display: none;
      width: 100%;
    }

    .no-results.show {
      display: block;
    }

    /* Футер */
    .footer {
      width: 100%;
      background-color: #f0fff8;
      border-top: 1px solid #1f2024;
      padding: 1.5rem 2rem;
      margin-top: 3rem;
      flex-shrink: 0;
    }

    .footer-content {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .footer-logo {
      height: 40px;
      width: auto;
      filter: brightness(0);
    }

    .footer-socials {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .footer-social-link {
      text-decoration: none;
      font-family: 'NotoSerifJP', serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #1f2024;
      text-transform: uppercase;
      transition: color 0.2s ease;
      position: relative;
      display: inline-block;
      border-bottom: none;
    }

    .footer-social-link .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      position: relative;
    }

    .footer-social-link .scale-wrapper::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: -4px;
      width: calc(100% + 8px);
      height: 1px;
      background-color: #700707;
      transform: scaleX(0);
      transition: transform 0.2s ease;
      transform-origin: center;
    }

    .footer-social-link:hover .scale-wrapper::after {
      transform: scaleX(1);
    }

    .footer-social-link:hover {
      color: #700707;
    }

    .footer-copyright {
      font-family: 'NotoSerifJP', serif;
      font-size: 0.7rem;
      font-weight: 300;
      color: #1f2024;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.5rem;
    }

    .footer-copyright .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
    }

    /* Адаптивность */
    @media (max-width: 1500px) {
      .video-card {
        width: 260px;
      }
      .video-grid {
        gap: 1.5rem;
      }
    }

    @media (max-width: 1100px) {
      .video-card {
        width: 240px;
      }
      .video-grid {
        gap: 1.5rem;
      }
      .title-box {
        padding: 1.5rem 1.5rem;
      }
    }

    @media (max-width: 800px) {
      .video-card {
        width: 220px;
      }
      .video-grid {
        gap: 1.2rem;
      }
      .title-box {
        padding: 1.2rem 1.2rem;
      }
      .page-title {
        font-size: 2rem;
        margin-bottom: 0.1rem;
        white-space: nowrap;
      }
      .page-subtitle {
        font-size: 1rem;
        padding: 0.08rem 0.4rem;
        white-space: nowrap;
      }
      .year-month-header {
        font-size: 1.2rem;
      }
      .video-title {
        font-size: 1rem;
      }
      .filter-btn {
        font-size: 1rem;
      }
      .filter-separator {
        font-size: 1rem;
        margin: 0 0.8rem;
      }
    }

    @media (max-width: 768px) {
      .left-panel, .right-panel {
        width: 40px;
      }

      .top-bar-inner {
        padding: 0.8rem 1rem;
        justify-content: flex-start;
      }

      .nav-container {
        gap: 1.5rem;
      }

      .nav {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
        right: 1rem;
      }

      .news-ticker-header {
        padding: 0.3rem 0;
      }

      .ticker-content-header {
        font-size: 0.75rem;
      }

      .news-badge-ticker {
        font-size: 0.6rem;
        padding: 0.1rem 0.4rem;
      }

      .content-inner {
        padding: 2rem 1rem 0 1rem;
      }

      .title-box {
        padding: 1rem 1rem;
      }

      .page-title {
        font-size: 1.6rem;
        margin-bottom: 0.08rem;
        white-space: nowrap;
      }

      .page-subtitle {
        font-size: 0.85rem;
        padding: 0.06rem 0.3rem;
        white-space: nowrap;
      }

      .filters-wrapper {
        margin-bottom: 1rem;
      }

      .filters-container {
        flex-direction: column;
        gap: 0.5rem;
      }

      .filter-btn {
        font-size: 1rem;
      }

      .filter-separator {
        display: none;
      }

      .divider-line {
        margin-bottom: 1.5rem;
      }

      .video-card {
        width: 100%;
        max-width: 400px;
      }

      .video-grid {
        gap: 1.5rem;
      }

      .year-month-section:not(:first-of-type) {
        margin-top: 1.5rem;
      }

      .year-month-header {
        font-size: 1.1rem;
      }

      .video-title {
        font-size: 1rem;
      }

      .video-date-top {
        font-size: 0.7rem;
        margin-bottom: 8px;
      }

      .play-badge {
        font-size: 0.6rem;
        padding: 3px 6px;
        bottom: 6px;
        left: 6px;
      }

      .video-link-top a {
        font-size: 0.75rem;
      }

      .footer {
        padding: 1rem 1.5rem;
        margin-top: 2rem;
      }

      .footer-logo {
        height: 30px;
      }

      .footer-social-link {
        font-size: 0.8rem;
      }

      .footer-copyright {
        font-size: 0.6rem;
      }

      .logo {
        height: 40px;
      }

      .tooltip {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .left-panel, .right-panel {
        width: 32px;
      }

      .top-bar-inner {
        padding: 0.6rem 0.8rem;
      }

      .nav-container {
        gap: 1rem;
      }

      .logo {
        height: 36px;
      }

      .mobile-menu-btn {
        right: 0.8rem;
        font-size: 1.5rem;
      }

      .mobile-nav {
        top: 56px;
        min-width: 160px;
        padding: 1rem;
      }

      .mobile-nav a {
        font-size: 0.9rem;
      }

      .ticker-content-header {
        font-size: 0.65rem;
      }

      .news-badge-ticker {
        font-size: 0.5rem;
        padding: 0.1rem 0.3rem;
      }

      .title-box {
        padding: 0.8rem 0.8rem;
      }

      .page-title {
        font-size: 1.3rem;
        margin-bottom: 0.06rem;
        white-space: nowrap;
      }

      .page-subtitle {
        font-size: 0.75rem;
        padding: 0.05rem 0.25rem;
        white-space: nowrap;
      }

      .content-inner {
        padding: 1.5rem 0.8rem 0 0.8rem;
      }

      .filters-container {
        gap: 0.3rem;
      }

      .filter-btn {
        font-size: 0.85rem;
      }

      .divider-line {
        margin-bottom: 1.2rem;
      }

      .year-month-section:not(:first-of-type) {
        margin-top: 1.2rem;
      }

      .year-month-label {
        font-size: 0.5rem;
      }

      .year-month-header {
        font-size: 0.9rem;
        margin: 0 0 0.8rem 0;
      }

      .video-card {
        max-width: 300px;
      }

      .video-grid {
        gap: 1.2rem;
      }

      .video-title {
        font-size: 0.9rem;
      }

        renderVideos();
      });
    });

    function groupVideos(videos) {
      const filteredVideos = videos.filter(video => {
        if (currentFilter === 'all') return true;
        return video.badge === currentFilter;
      });

      const grouped = {};
      filteredVideos.forEach(video => {
        if (!grouped[video.year]) grouped[video.year] = {};
        if (!grouped[video.year][video.month]) grouped[video.year][video.month] = [];
        grouped[video.year][video.month].push(video);
      });
      return grouped;
    }
    
    function createVideoCard(video) {
      const videoCard = document.createElement('div');
      videoCard.className = 'video-card';
      
      const dateTopDiv = document.createElement('div');
      dateTopDiv.className = 'video-date-top';
      const dateTopSpan = document.createElement('span');
      dateTopSpan.className = 'scale-wrapper';
      dateTopSpan.textContent = video.date;
      dateTopDiv.appendChild(dateTopSpan);
      
      const thumbLink = document.createElement('a');
      thumbLink.className = 'video-thumb-link';
      thumbLink.href = video.link;
      thumbLink.target = '_blank';
      
      const thumbDiv = document.createElement('div');
      thumbDiv.className = 'video-thumb' + (video.isPlaceholder ? ' placeholder' : '');
      
      if (video.isPlaceholder) {
        thumbDiv.innerHTML = '<span class="coming-soon"><span class="scale-wrapper">Coming soon</span></span>';
      } else {
        thumbDiv.innerHTML = `<img src="${video.thumbnail}" alt="${video.title}">`;
      }
      
      if (!video.isPlaceholder) {
        const playBadge = document.createElement('div');
        playBadge.className = 'play-badge';
        playBadge.textContent = video.badge || 'Music Video';
        thumbLink.appendChild(playBadge);
      }
      
      thumbLink.appendChild(thumbDiv);
      
      if (video.topLink && video.topLinkText) {
        const linkTopDiv = document.createElement('div');
        linkTopDiv.className = 'video-link-top';
        const linkElement = document.createElement('a');
        linkElement.href = video.topLink;
        linkElement.target = '_blank';
        linkElement.innerHTML = `<span class="arrow">➥</span><span class="link-text">${video.topLinkText}</span>`;
        linkTopDiv.appendChild(linkElement);
        videoCard.appendChild(dateTopDiv);
        videoCard.appendChild(thumbLink);
        videoCard.appendChild(linkTopDiv);
      } else {
        videoCard.appendChild(dateTopDiv);
        videoCard.appendChild(thumbLink);
      }
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'video-title';
      const titleSpan = document.createElement('span');
      titleSpan.className = 'scale-wrapper';
      titleSpan.textContent = video.title;
      titleDiv.appendChild(titleSpan);
      
      videoCard.appendChild(titleDiv);
      
      return videoCard;
    }
    
    function renderVideos() {
      const timeline = document.getElementById('videoTimeline');
      timeline.innerHTML = '';
      
      const grouped = groupVideos(videos);
      const years = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
      
      if (years.length === 0) {
        noResults.classList.add('show');
      } else {
        noResults.classList.remove('show');
      }
      
      years.forEach(year => {
        const monthsInYear = grouped[year];
        const monthOrder = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
        const sortedMonths = Object.keys(monthsInYear).sort((a, b) => monthOrder.indexOf(b) - monthOrder.indexOf(a));
        
        sortedMonths.forEach(month => {
          const yearMonthSection = document.createElement('div');
          yearMonthSection.className = 'year-month-section';
          
          const yearMonthLabel = document.createElement('div');
          yearMonthLabel.className = 'year-month-label';
          yearMonthLabel.textContent = 'YEAR / MONTH';
          yearMonthSection.appendChild(yearMonthLabel);
          
          const yearMonthHeader = document.createElement('div');
          yearMonthHeader.className = 'year-month-header';
          yearMonthHeader.innerHTML = `<span class="year">${year}</span><span class="month">${month}</span>`;
          yearMonthSection.appendChild(yearMonthHeader);
          
          timeline.appendChild(yearMonthSection);
          
          const videoGrid = document.createElement('div');
          videoGrid.className = 'video-grid';
          
          monthsInYear[month].forEach(video => {
            videoGrid.appendChild(createVideoCard(video));
          });
          
          timeline.appendChild(videoGrid);
        });
      });
    }
