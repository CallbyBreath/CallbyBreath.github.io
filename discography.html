<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>callbybreath official website</title>
  <link rel="icon" type="image/png" href="Images/logo.png">
  <style>
    @font-face {
      font-family: 'Eitai';
      src: url('Font/Eitai.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'NotoSerifJP';
      src: url('Font/NotoSerifJP-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #f0fff8;
      font-family: 'Eitai', sans-serif;
      color: #1f2024;
      line-height: 1.5;
      display: flex;
      flex-direction: row;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: auto;
    }

    .left-panel {
      width: 64px;
      background-color: #1f2024;
      flex-shrink: 0;
      height: 100vh;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .right-panel {
      width: 64px;
      background-color: #1f2024;
      flex-shrink: 0;
      height: 100vh;
    }

    .top-bar {
      background-color: #1f2024;
      width: 100%;
      padding: 0;
      flex-shrink: 0;
    }

    .top-bar-inner {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2rem;
      position: relative;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
    }

    .logo {
      height: 48px;
      width: auto;
      display: block;
      cursor: pointer;
      filter: brightness(0) invert(1);
    }

    .tooltip {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      background-color: #1f2024;
      color: #f0fff8;
      font-size: 0.8rem;
      font-weight: 340;
      padding: 8px 14px;
      white-space: nowrap;
      border-left: 2px solid #700707;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .logo-wrapper:hover .tooltip {
      opacity: 1;
      visibility: visible;
    }

    .nav {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .nav a {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 380;
      letter-spacing: 0.3px;
      color: #f0fff8;
      transition: color 0.2s;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .nav a:hover {
      color: #700707;
    }

    .nav a.active {
      color: #700707;
      border-bottom: 2px solid #700707;
    }

    .nav-separator {
      color: #f0fff8;
      font-size: 0.9rem;
      display: inline-block;
      transform: scaleX(0.65);
    }

    .news-ticker-header {
      width: 100%;
      background-color: #700707;
      padding: 0.4rem 0;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .news-ticker-header:hover {
      background-color: #1f2024;
    }

    .news-ticker-header .ticker-content-header {
      color: #f0fff8;
    }

    .news-ticker-header .news-badge-ticker {
      background-color: #f0fff8;
      color: #700707;
    }

    .news-ticker-header:hover .news-badge-ticker {
      background-color: #700707;
      color: #f0fff8;
    }

    .ticker-content-header {
      display: inline-block;
      animation: ticker-header 30s linear infinite;
      font-family: 'NotoSerifJP', serif;
      font-size: 0.9rem;
      font-weight: 300;
      text-transform: uppercase;
      padding-left: 20px;
    }

    .ticker-content-header span {
      margin-right: 40px;
    }

    .news-badge-ticker {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      margin: 0 10px;
      font-family: 'Eitai', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes ticker-header {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: #f0fff8;
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
      position: absolute;
      right: 2rem;
    }

    .mobile-menu-btn:hover {
      color: #700707;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      top: 64px;
      right: 0;
      background-color: #1f2024;
      padding: 1.5rem;
      flex-direction: column;
      gap: 1.2rem;
      z-index: 999;
      border-left: none;
      border-bottom: none;
      min-width: 200px;
    }

    .mobile-nav.active {
      display: flex;
    }

    .mobile-nav a {
      text-decoration: none;
      font-size: 1rem;
      font-weight: 380;
      letter-spacing: 0.3px;
      color: #f0fff8;
      transition: color 0.2s;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .mobile-nav a:hover {
      color: #700707;
    }

    .mobile-nav a.active {
      color: #700707;
      border-bottom: 2px solid #700707;
    }

    .page-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      display: flex;
      flex-direction: column;
    }

    .page-wrapper::-webkit-scrollbar {
      display: none;
    }

    .content-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 4rem 2rem 0 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .title-box {
      background-image: url('Images/background01_red.jpg');
      background-size: cover;
      background-position: center;
      width: 100%;
      max-width: 1600px;
      padding: 1.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }

    .page-title {
      font-size: 3rem;
      font-weight: 700;
      color: #700707;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 0.15rem;
      white-space: nowrap;
      text-shadow: 
        -1px -1px 0 #f0fff8,
        1px -1px 0 #f0fff8,
        -1px 1px 0 #f0fff8,
        1px 1px 0 #f0fff8;
    }

    .page-title .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: center;
    }

    .page-subtitle {
      font-family: 'NotoSerifJP', serif;
      font-size: 1.3rem;
      font-weight: 300;
      color: #f0fff8;
      letter-spacing: 2px;
      display: inline-block;
      background-color: #700707;
      padding: 0.1rem 0.5rem;
      white-space: nowrap;
    }

    .page-subtitle .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.8);
      transform-origin: center;
    }

    .filters-wrapper {
      width: 100%;
      max-width: 1600px;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
    }

    .filters-container {
      display: flex;
      gap: 0;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: #1f2024;
      font-family: 'Eitai', sans-serif;
      font-size: 1.125rem;
      font-weight: 400;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      padding: 0;
      transform: scaleX(0.65);
    }

    .filter-btn:hover {
      color: #700707;
    }

    .filter-btn.active {
      color: #700707;
    }

    .filter-separator {
      color: #1f2024;
      margin: 0 1.2rem;
      font-size: 1.125rem;
      transform: scaleX(0.65);
      display: inline-block;
    }

    .divider-line {
      width: 100%;
      max-width: 1600px;
      height: 1px;
      background-color: #1f2024;
      margin-bottom: 2rem;
    }

    /* Контейнер для всего контента альбомов */
    #albumsContainer {
      width: 100%;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .year-month-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 0 1rem 0;
      width: 100%;
    }

    .year-month-section:first-of-type {
      margin-top: 0;
    }

    .year-month-section:not(:first-of-type) {
      margin-top: 2rem;
    }

    .year-month-label {
      font-size: 0.55rem;
      font-weight: 400;
      color: #1f2024;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
      line-height: 1;
      transform: scaleX(0.65);
    }

    .year-month-header {
      font-size: 1.3rem;
      font-weight: 380;
      color: #700707;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      margin: 0 0 1rem 0;
      transform: scaleX(0.65);
      line-height: 1;
    }

    .year-month-header .year {
      font-weight: 600;
      color: #1f2024;
      margin-right: 0.5rem;
    }

    .year-month-header .month {
      font-weight: 400;
    }

    /* НОВАЯ СЕТКА АЛЬБОМОВ С АВТОМАТИЧЕСКИМ ЦЕНТРИРОВАНИЕМ */
    .albums-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.8rem;
      width: 100%;
      max-width: 100%;
    }

    /* Карточка альбома — фиксированная ширина для правильного центрирования */
    .album-card {
      display: flex;
      flex-direction: column;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      text-decoration: none;
      width: 280px;
      flex-shrink: 0;
    }

    .album-card.hidden {
      display: none;
    }

    .album-card:hover {
      transform: translateY(-4px);
    }

    .album-card:hover .album-cover {
      border-color: #700707;
    }

    .album-cover-wrapper {
      position: relative;
      margin-bottom: 10px;
    }

    .album-cover {
      aspect-ratio: 1 / 1;
      background-color: #1f2024;
      border: 1px solid #1f2024;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .album-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-type-badge {
      position: absolute;
      bottom: 6px;
      left: 6px;
      padding: 3px 8px;
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #1f2024;
      background-color: #f0fff8;
      text-transform: uppercase;
      z-index: 10;
    }

    .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: center;
    }

    .nav a {
      display: inline-block;
    }

    .nav a .scale-wrapper {
      display: inline-block;
    }

    .mobile-nav a {
      display: block;
      text-align: center;
    }

    .mobile-nav a .scale-wrapper {
      display: inline-block;
    }

    .tooltip .scale-wrapper {
      display: inline-block;
      white-space: nowrap;
    }

    .album-type-badge .scale-wrapper {
      display: inline-block;
      white-space: nowrap;
    }

    .album-title {
      font-size: 1.2rem;
      font-weight: 300;
      color: #1f2024;
      line-height: 1.3;
      margin-bottom: 3px;
      font-family: 'NotoSerifJP', serif;
      text-align: center;
      display: flex;
      justify-content: center;
    }

    .album-date {
      font-size: 0.75rem;
      font-weight: 300;
      color: #1f2024;
      letter-spacing: 0.5px;
      font-family: 'NotoSerifJP', serif;
      text-align: center;
      display: flex;
      justify-content: center;
    }

    .album-title .scale-wrapper,
    .album-date .scale-wrapper {
      display: inline-block;
    }

    .no-results {
      text-align: center;
      font-size: 1rem;
      color: #1f2024;
      margin-top: 2rem;
      transform: scaleX(0.65);
      display: none;
      width: 100%;
    }

    .no-results.show {
      display: block;
    }

    .footer {
      width: 100%;
      background-color: #f0fff8;
      border-top: 1px solid #1f2024;
      padding: 1.5rem 2rem;
      margin-top: 3rem;
      flex-shrink: 0;
    }

    .footer-content {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .footer-logo {
      height: 40px;
      width: auto;
      filter: brightness(0);
    }

    .footer-socials {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .footer-social-link {
      text-decoration: none;
      font-family: 'NotoSerifJP', serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #1f2024;
      text-transform: uppercase;
      transition: color 0.2s ease;
      position: relative;
      display: inline-block;
      border-bottom: none;
    }

    .footer-social-link .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      position: relative;
    }

    .footer-social-link .scale-wrapper::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: -4px;
      width: calc(100% + 8px);
      height: 1px;
      background-color: #700707;
      transform: scaleX(0);
      transition: transform 0.2s ease;
      transform-origin: center;
    }

    .footer-social-link:hover .scale-wrapper::after {
      transform: scaleX(1);
    }

    .footer-social-link:hover {
      color: #700707;
    }

    .footer-copyright {
      font-family: 'NotoSerifJP', serif;
      font-size: 0.7rem;
      font-weight: 300;
      color: #1f2024;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.5rem;
    }

    .footer-copyright .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
    }

    /* Адаптивность */
    @media (max-width: 1500px) {
      .album-card {
        width: 260px;
      }
      .albums-grid {
        gap: 1.5rem;
      }
    }

    @media (max-width: 1100px) {
      .album-card {
        width: 240px;
      }
      .albums-grid {
        gap: 1.5rem;
      }
      .title-box {
        padding: 1.5rem 1.5rem;
      }
    }

    @media (max-width: 800px) {
      .album-card {
        width: 220px;
      }
      .albums-grid {
        gap: 1.2rem;
      }
      .title-box {
        padding: 1.2rem 1.2rem;
      }
      .page-title {
        font-size: 2rem;
        margin-bottom: 0.1rem;
        white-space: nowrap;
      }
      .page-subtitle {
        font-size: 1rem;
        padding: 0.08rem 0.4rem;
        white-space: nowrap;
      }
      .year-month-header {
        font-size: 1.2rem;
      }
      .album-title {
        font-size: 1rem;
      }
      .filter-btn {
        font-size: 1rem;
      }
      .filter-separator {
        font-size: 1rem;
        margin: 0 0.8rem;
      }
    }

    @media (max-width: 768px) {
      .left-panel, .right-panel {
        width: 40px;
      }

      .top-bar-inner {
        padding: 0.8rem 1rem;
        justify-content: flex-start;
      }

      .nav-container {
        gap: 1.5rem;
      }

      .nav {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
        right: 1rem;
      }

      .news-ticker-header {
        padding: 0.3rem 0;
      }

      .ticker-content-header {
        font-size: 0.75rem;
      }

      .news-badge-ticker {
        font-size: 0.6rem;
        padding: 0.1rem 0.4rem;
      }

      .content-inner {
        padding: 2rem 1rem 0 1rem;
      }

      .title-box {
        padding: 1rem 1rem;
      }

      .page-title {
        font-size: 1.6rem;
        margin-bottom: 0.08rem;
        white-space: nowrap;
      }

      .page-subtitle {
        font-size: 0.85rem;
        padding: 0.06rem 0.3rem;
        white-space: nowrap;
      }

      .filters-wrapper {
        margin-bottom: 1rem;
      }

      .filters-container {
        flex-direction: column;
        gap: 0.5rem;
      }

      .filter-btn {
        font-size: 1rem;
      }

      .filter-separator {
        display: none;
      }

      .divider-line {
        margin-bottom: 1.5rem;
      }

      .album-card {
        width: 100%;
        max-width: 400px;
      }

      .albums-grid {
        gap: 1.5rem;
      }

      .year-month-section:not(:first-of-type) {
        margin-top: 1.5rem;
      }

      .year-month-header {
        font-size: 1.1rem;
      }

      .album-title {
        font-size: 1rem;
      }

      .album-date {
        font-size: 0.7rem;
      }

      .album-type-badge {
        font-size: 0.55rem;
        padding: 2px 6px;
      }

      .footer {
        padding: 1rem 1.5rem;
        margin-top: 2rem;
      }

      .footer-logo {
        height: 30px;
      }

      .footer-social-link {
        font-size: 0.8rem;
      }

      .footer-copyright {
        font-size: 0.6rem;
      }

      .logo {
        height: 40px;
      }

      .tooltip {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .left-panel, .right-panel {
        width: 32px;
      }

      .top-bar-inner {
        padding: 0.6rem 0.8rem;
      }

      .nav-container {
        gap: 1rem;
      }

      .logo {
        height: 36px;
      }

      .mobile-menu-btn {
        right: 0.8rem;
        font-size: 1.5rem;
      }

      .mobile-nav {
        top: 56px;
        min-width: 160px;
        padding: 1rem;
      }

      .mobile-nav a {
        font-size: 0.9rem;
      }

      .ticker-content-header {
        font-size: 0.65rem;
      }

      .news-badge-ticker {
        font-size: 0.5rem;
        padding: 0.1rem 0.3rem;
      }

      .title-box {
        padding: 0.8rem 0.8rem;
      }

      .page-title {
        font-size: 1.3rem;
        margin-bottom: 0.06rem;
        white-space: nowrap;
      }

      .page-subtitle {
        font-size: 0.75rem;
        padding: 0.05rem 0.25rem;
        white-space: nowrap;
      }

      .content-inner {
        padding: 1.5rem 0.8rem 0 0.8rem;
      }

      .filters-container {
        gap: 0.3rem;
      }

      .filter-btn {
        font-size: 0.85rem;
      }

      .divider-line {
        margin-bottom: 1.2rem;
      }

      .year-month-section:not(:first-of-type) {
        margin-top: 1.2rem;
      }

      .year-month-label {
        font-size: 0.5rem;
      }

      .year-month-header {
        font-size: 0.9rem;
        margin: 0 0 0.8rem 0;
      }

      .album-card {
        max-width: 300px;
      }

      .albums-grid {
        gap: 1.2rem;
      }

      .album-title {
        font-size: 0.9rem;
      }

      .album-date {
        font-size: 0.6rem;
      }

      .footer {
        padding: 0.8rem 1rem;
      }

      .footer-top {
        flex-direction: column;
        gap: 1rem;
      }

      .footer-logo {
        height: 25px;
      }

      .footer-socials {
        gap: 1rem;
      }

      .footer-social-link {
        font-size: 0.7rem;
      }

      .footer-copyright {
        font-size: 0.5rem;
      }
    }

    @media (max-width: 360px) {
      .title-box {
        padding: 0.6rem 0.6rem;
      }

      .page-title {
        font-size: 1.1rem;
        margin-bottom: 0.05rem;
        white-space: nowrap;
      }

      .page-subtitle {
        font-size: 0.65rem;
        padding: 0.04rem 0.2rem;
        white-space: nowrap;
      }

      .filter-btn {
        font-size: 0.75rem;
      }

      .year-month-header {
        font-size: 0.8rem;
      }

      .album-card {
        max-width: 250px;
      }

      .album-title {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="left-panel"></div>

  <div class="main-content">
    <div class="top-bar">

  <script>
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileNav = document.getElementById('mobileNav');

    mobileMenuBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!mobileNav.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
        mobileNav.classList.remove('active');
      }
    });

    const tickerNews = [
      { date: "2025.04.15", title: "CALLBYBREATH IS NOW AVAILABLE ON INSTAGRAM, PINTEREST, DISCORD, TELEGRAM, VK!", isLatest: true },
      { date: "2025.04.15", title: "CALLBYBREATH OFFICIAL WEBSITE OUT NOW! NEW DESIGN!", isLatest: false }
    ];

    function renderTicker() {
      const ticker = document.getElementById('tickerHeader');
      
      let contentHTML = '';
      tickerNews.forEach(news => {
        contentHTML += `<span>${news.date}  `;
        if (news.isLatest) {
          contentHTML += `<span class="news-badge-ticker">LATEST NEWS</span>  `;
        }
        contentHTML += `${news.title}  ◆  </span>`;
      });
      
      ticker.innerHTML = contentHTML + contentHTML;
    }

    renderTicker();

    const socialLinks = [
      { name: 'youtube', url: 'https://www.youtube.com/@CallbyBreath' },
      { name: 'instagram', url: 'https://www.instagram.com/callbybreath.official' },
      { name: 'pinterest', url: 'https://pinterest.com/callbybreath' },
      { name: 'telegram', url: 'https://t.me/callbybreath' },
      { name: 'spotify', url: 'https://open.spotify.com/artist/4RJTPseEgwmAZIto7YDuV6' },
      { name: 'apple music', url: 'https://music.apple.com/ru/artist/callbybreath/1602956679' }
    ];

    function renderFooterSocials() {
      const container = document.getElementById('footerSocials');
      container.innerHTML = '';
      
      socialLinks.forEach(link => {
        const a = document.createElement('a');
        a.className = 'footer-social-link';
        a.href = link.url;
        a.target = '_blank';
        a.innerHTML = `<span class="scale-wrapper">${link.name}</span>`;
        container.appendChild(a);
      });
    }

    renderFooterSocials();

    const albums = [
      { cover: 'Images/Releases/single_01.jpg', title: "FREDDY FAZBEAR'S COMING TO HOUSE", date: '2021.12.31', year: '2021', month: 'DECEMBER', type: 'SINGLE', link: 'releases/single_01.html' },
      { cover: 'Images/Releases/single_02.jpg', title: "TO DO EVERYTHING", date: '2022.02.02', year: '2022', month: 'FEBRUARY', type: 'SINGLE', link: 'releases/single_02.html' },
      { cover: 'Images/Releases/single_03.jpg', title: "IT'S NOT YOU TIME", date: '2022.06.25', year: '2022', month: 'JUNE', type: 'SINGLE', link: 'releases/single_03.html' },
      { cover: 'Images/Releases/single_04.jpg', title: "SYSTEM LOST", date: '2022.07.29', year: '2022', month: 'JULY', type: 'SINGLE', link: 'releases/single_04.html' },
      { cover: 'Images/Releases/single_05.jpg', title: "АНИМЕ ПОЗЕР", date: '2022.08.11', year: '2022', month: 'AUGUST', type: 'SINGLE', link: 'releases/single_05.html' },
      { cover: 'Images/Releases/single_06.jpg', title: "THE LAST EVENING", date: '2023.01.18', year: '2023', month: 'JANUARY', type: 'SINGLE', link: 'releases/single_06.html' },
      { cover: 'Images/Releases/single_07.jpg', title: "FLYING TOWARDS DREAMS", date: '2023.01.18', year: '2023', month: 'JANUARY', type: 'SINGLE', link: 'releases/single_07.html' },
      { cover: 'Images/Releases/single_08.jpg', title: "THROUGH DECEMBER", date: '2023.01.19', year: '2023', month: 'JANUARY', type: 'SINGLE', link: 'releases/single_08.html' },
      { cover: 'Images/Releases/single_09.jpg', title: "EVERYTHING FOR YOU", date: '2023.01.19', year: '2023', month: 'JANUARY', type: 'SINGLE', link: 'releases/single_09.html' },
      { cover: 'Images/Releases/single_10.jpg', title: "Sunburst Mood", date: '2023.02.13', year: '2023', month: 'FEBRUARY', type: 'SINGLE', link: 'releases/single_10.html' },
      { cover: 'Images/Releases/single_11.jpg', title: "Ordinary Day", date: '2023.03.10', year: '2023', month: 'MARCH', type: 'SINGLE', link: 'releases/single_11.html' },
      { cover: 'Images/Releases/single_12.jpg', title: "FREDDY FAZBEAR'S COMING TO HOUSE 2023", date: '2022.12.28', year: '2022', month: 'DECEMBER', type: 'SINGLE', link: 'releases/single_12.html' },
      { cover: 'Images/Releases/ep_01.png', title: 'ДЛЯ ТЕХ, КТО ОДИНОК', date: '2023.03.06', year: '2023', month: 'MARCH', type: 'EP', link: 'releases/ep_01.html' },
      { cover: 'Images/Releases/single_13.png', title: 'Я НЕ МОГУ УСНУТЬ', date: '2023.03.10', year: '2023', month: 'MARCH', type: 'SINGLE', link: 'releases/single_13.html' },
      { cover: 'Images/Releases/single_14.png', title: 'НАШЕЕ РЫЖЕЕ СЧАСТЬЕ', date: '2023.04.03', year: '2023', month: 'APRIL', type: 'SINGLE', link: 'releases/single_14.html' },
      { cover: 'Images/Releases/single_15.jpeg', title: 'ДОЖДИСЬ МЕНЯ', date: '2023.04.07', year: '2023', month: 'APRIL', type: 'SINGLE', link: 'releases/single_15.html' },
      { cover: 'Images/Releases/single_16.jpeg', title: 'Я ТЕБЯ ЛЮБЛЮ', date: '2023.04.17', year: '2023', month: 'APRIL', type: 'SINGLE', link: 'releases/single_16.html' },
      { cover: 'Images/Releases/single_17.jpeg', title: 'ДИСКОРД', date: '2023.06.14', year: '2023', month: 'JUNE', type: 'SINGLE', link: 'releases/single_17.html' },
      { cover: 'Images/Releases/single_18.jpeg', title: 'ДЕВОЧКА МЕЧТЫ', date: '2023.06.15', year: '2023', month: 'JUNE', type: 'SINGLE', link: 'releases/single_18.html' },
      { cover: 'Images/Releases/single_19.jpeg', title: 'РАССЕКАЙ', date: '2023.08.11', year: '2023', month: 'AUGUST', type: 'SINGLE', link: 'releases/single_19.html' },
    ];

    let currentFilter = 'all';
    const filterButtons = document.querySelectorAll('.filter-btn');
    const noResults = document.getElementById('noResults');
    const container = document.getElementById('albumsContainer');

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderAlbums();
      });
    });
    
    function groupAlbums(albums) {
      const filteredAlbums = albums.filter(album => {
        if (currentFilter === 'all') return true;
        return album.type === currentFilter;
      });

      const grouped = {};
      filteredAlbums.forEach(album => {
        if (!grouped[album.year]) grouped[album.year] = {};
        if (!grouped[album.year][album.month]) grouped[album.year][album.month] = [];
        grouped[album.year][album.month].push(album);
      });
      return grouped;
    }

    function createAlbumCard(album) {
      const albumCard = document.createElement('a');
      albumCard.className = 'album-card';
      albumCard.href = album.link;
      albumCard.target = '_blank';
      
      const coverWrapper = document.createElement('div');
      coverWrapper.className = 'album-cover-wrapper';
      
      const coverDiv = document.createElement('div');
      coverDiv.className = 'album-cover';
      const coverImg = document.createElement('img');
      coverImg.src = album.cover;
      coverImg.alt = album.title;
      coverDiv.appendChild(coverImg);
      
      const typeDiv = document.createElement('div');
      typeDiv.className = 'album-type-badge';
      const typeSpan = document.createElement('span');
      typeSpan.className = 'scale-wrapper';
      typeSpan.textContent = album.type;
      typeDiv.appendChild(typeSpan);
      
      coverWrapper.appendChild(coverDiv);
      coverWrapper.appendChild(typeDiv);
      
      const titleDiv = document.createElement('div');
      titleDiv.className = 'album-title';
      const titleSpan = document.createElement('span');
      titleSpan.className = 'scale-wrapper';
      titleSpan.textContent = album.title;
      titleDiv.appendChild(titleSpan);
      
      const dateDiv = document.createElement('div');
      dateDiv.className = 'album-date';
      const dateSpan = document.createElement('span');
      dateSpan.className = 'scale-wrapper';
      dateSpan.textContent = album.date;
      dateDiv.appendChild(dateSpan);
      
      albumCard.appendChild(coverWrapper);
      albumCard.appendChild(titleDiv);
      albumCard.appendChild(dateDiv);
      
      return albumCard;
    }
    
    function renderAlbums() {
      container.innerHTML = '';
      
      const grouped = groupAlbums(albums);
      const years = Object.keys(grouped).sort((a, b) => b.localeCompare(a));
      
      if (years.length === 0) {
        noResults.classList.add('show');
      } else {
        noResults.classList.remove('show');
      }
      
      years.forEach(year => {
        const monthsInYear = grouped[year];
        const monthOrder = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
        const sortedMonths = Object.keys(monthsInYear).sort((a, b) => monthOrder.indexOf(b) - monthOrder.indexOf(a));
        
        sortedMonths.forEach(month => {
          const yearMonthSection = document.createElement('div');
          yearMonthSection.className = 'year-month-section';
          
          const yearMonthLabel = document.createElement('div');
          yearMonthLabel.className = 'year-month-label';
          yearMonthLabel.textContent = 'YEAR / MONTH';
          yearMonthSection.appendChild(yearMonthLabel);
          
          const yearMonthHeader = document.createElement('div');
          yearMonthHeader.className = 'year-month-header';
          yearMonthHeader.innerHTML = `<span class="year">${year}</span><span class="month">${month}</span>`;
          yearMonthSection.appendChild(yearMonthHeader);
          
          container.appendChild(yearMonthSection);
          
          const albumsGrid = document.createElement('div');
          albumsGrid.className = 'albums-grid';
          
          monthsInYear[month].forEach(album => {
            albumsGrid.appendChild(createAlbumCard(album));
          });
          
          container.appendChild(albumsGrid);
        });
      });
    }
    
    renderAlbums();

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });

    document.addEventListener('copy', (e) => {
      e.preventDefault();
      return false;
    });

    document.addEventListener('cut', (e) => {
      e.preventDefault();
      return false;
    });

    document.addEventListener('dragstart', (e) => {
      e.preventDefault();
      return false;
    });
  </script>
