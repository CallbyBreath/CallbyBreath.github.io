<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>callbybreath official website</title>
  <link rel="icon" type="image/png" href="Images/logo.png">
  <style>
    @font-face {
      font-family: 'Eitai';
      src: url('Font/Eitai.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'NotoSerifJP';
      src: url('Font/NotoSerifJP-Light.ttf') format('truetype');
      font-weight: 300;
      font-style: normal;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #f0fff8;
      font-family: 'Eitai', sans-serif;
      color: #1f2024;
      line-height: 1.5;
      display: flex;
      flex-direction: row;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    img {
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: auto;
    }

    .left-panel, .right-panel {
      width: 64px;
      background-color: #1f2024;
      flex-shrink: 0;
      height: 100vh;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .top-bar {
      background-color: #1f2024;
      width: 100%;
      padding: 0;
      flex-shrink: 0;
    }

    .top-bar-inner {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2rem;
      position: relative;
    }

    .nav-container {
      display: flex;
      align-items: center;
      gap: 3rem;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
    }

    .logo {
      height: 48px;
      width: auto;
      display: block;
      cursor: pointer;
      filter: brightness(0) invert(1);
    }

    .tooltip {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 8px;
      background-color: #1f2024;
      color: #f0fff8;
      font-size: 0.8rem;
      font-weight: 340;
      padding: 8px 14px;
      white-space: nowrap;
      border-left: 2px solid #700707;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .logo-wrapper:hover .tooltip {
      opacity: 1;
      visibility: visible;
    }

    .nav {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .nav a {
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 380;
      letter-spacing: 0.3px;
      color: #f0fff8;
      transition: color 0.2s;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
    }

    .nav a:hover {
      color: #700707;
    }

    .nav a.active {
      color: #700707;
      border-bottom: 2px solid #700707;
    }

    .nav-separator {
      color: #f0fff8;
      font-size: 0.9rem;
      display: inline-block;
      transform: scaleX(0.65);
    }

    .news-ticker-header {
      width: 100%;
      background-color: #700707;
      padding: 0.4rem 0;
      overflow: hidden;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      display: block;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .news-ticker-header:hover {
      background-color: #1f2024;
    }

    .news-ticker-header .ticker-content-header {
      color: #f0fff8;
    }

    .news-ticker-header .news-badge-ticker {
      background-color: #f0fff8;
      color: #700707;
    }

    .news-ticker-header:hover .news-badge-ticker {
      background-color: #700707;
      color: #f0fff8;
    }

    .ticker-content-header {
      display: inline-block;
      animation: ticker-header 30s linear infinite;
      font-family: 'NotoSerifJP', serif;
      font-size: 0.9rem;
      font-weight: 300;
      text-transform: uppercase;
      padding-left: 20px;
    }

    .ticker-content-header span {
      margin-right: 40px;
    }

    .news-badge-ticker {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      margin: 0 10px;
      font-family: 'Eitai', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    @keyframes ticker-header {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: #f0fff8;
      font-size: 1.8rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: color 0.2s;
      position: absolute;
      right: 2rem;
    }

    .mobile-menu-btn:hover {
      color: #700707;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      top: 64px;
      right: 0;
      background-color: #1f2024;
      padding: 1.5rem;
      flex-direction: column;
      gap: 1.2rem;
      z-index: 999;
      border-left: none;
      border-bottom: none;
      min-width: 200px;
    }

    .mobile-nav.active {
      display: flex;
    }

    .mobile-nav a {
      text-decoration: none;
      font-size: 1rem;
      font-weight: 380;
      letter-spacing: 0.3px;
      color: #f0fff8;
      transition: color 0.2s;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      text-align: center;
    }

    .mobile-nav a:hover {
      color: #700707;
    }

    .mobile-nav a.active {
      color: #700707;
      border-bottom: 2px solid #700707;
    }

    .page-wrapper {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      display: flex;
      flex-direction: column;
    }

    .page-wrapper::-webkit-scrollbar {
      display: none;
    }

    .content-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 4rem 2rem 0 2rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      transform-origin: center;
    }

    .page-title {
      font-size: 3rem;
      font-weight: 300;
      font-family: 'NotoSerifJP', serif;
      color: #700707;
      text-align: center;
      letter-spacing: 3px;
      margin-bottom: 3rem;
      text-transform: uppercase;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .contacts-container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      width: 100%;
      max-width: 380px;
    }

    .btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .contact-btn {
      display: block;
      text-decoration: none;
      text-align: center;
      font-size: 1.6rem;
      font-weight: 380;
      letter-spacing: 1px;
      color: #1f2024;
      background: transparent;
      border: 2px solid #700707;
      padding: 16px 0;
      transition: all 0.2s ease;
      width: 100%;
    }

    .contact-btn .scale-wrapper {
      display: inline-block;
    }

    .contact-btn:hover {
      background-color: #700707;
      color: #f0fff8;
    }

    .btn-caption {
      font-size: 0.9rem;
      font-weight: 300;
      color: #1f2024;
      letter-spacing: 0.5px;
      font-family: 'NotoSerifJP', serif;
      display: flex;
      justify-content: center;
    }

    .btn-caption .scale-wrapper {
      display: inline-block;
    }

    .footer {
      width: 100%;
      background-color: #f0fff8;
      border-top: 1px solid #1f2024;
      padding: 1.5rem 2rem;
      margin-top: 3rem;
      flex-shrink: 0;
    }

    .footer-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .footer-logo {
      height: 40px;
      width: auto;
      filter: brightness(0);
    }

    .footer-socials {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .footer-social-link {
      text-decoration: none;
      font-family: 'NotoSerifJP', serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #1f2024;
      text-transform: uppercase;
      transition: color 0.2s ease;
      position: relative;
      display: inline-block;
      border-bottom: none;
    }

    .footer-social-link .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
      position: relative;
    }

    .footer-social-link .scale-wrapper::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: -4px;
      width: calc(100% + 8px);
      height: 1px;
      background-color: #700707;
      transform: scaleX(0);
      transition: transform 0.2s ease;
      transform-origin: center;
    }

    .footer-social-link:hover .scale-wrapper::after {
      transform: scaleX(1);
    }

    .footer-social-link:hover {
      color: #700707;
    }

    .footer-copyright {
      font-family: 'NotoSerifJP', serif;
      font-size: 0.7rem;
      font-weight: 300;
      color: #1f2024;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 0.5rem;
    }

    .footer-copyright .scale-wrapper {
      display: inline-block;
      transform: scaleX(0.65);
    }

    .nav a {
      display: inline-block;
    }

    .nav a .scale-wrapper {
      display: inline-block;
    }

    .mobile-nav a {
      display: block;
      text-align: center;
    }

    .mobile-nav a .scale-wrapper {
      display: inline-block;
    }

    .tooltip .scale-wrapper {
      display: inline-block;
      white-space: nowrap;
    }

    @media (max-width: 768px) {
      .left-panel, .right-panel {
        width: 40px;
      }

      .top-bar-inner {
        padding: 0.8rem 1rem;
        justify-content: flex-start;
      }

      .nav-container {
        gap: 1.5rem;
      }

      .nav {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
        right: 1rem;
      }

      .news-ticker-header {
        padding: 0.3rem 0;
      }

      .ticker-content-header {
        font-size: 0.75rem;
      }

      .news-badge-ticker {
        font-size: 0.6rem;
        padding: 0.1rem 0.4rem;
      }

      .content-inner {
        padding: 2rem 1rem 0 1rem;
      }

      .page-title {
        font-size: 2rem;
        margin-bottom: 2rem;
      }

      .contact-btn {
        font-size: 1.4rem;
      }

      .btn-caption {
        font-size: 0.8rem;
      }

      .footer {
        padding: 1rem 1.5rem;
        margin-top: 2rem;
      }

      .footer-logo {
        height: 30px;
      }

      .footer-social-link {
        font-size: 0.8rem;
      }

      .footer-copyright {
        font-size: 0.6rem;
      }

      .logo {
        height: 40px;
      }

      .tooltip {
        display: none;
      }
    }

    @media (max-width: 480px) {
      .left-panel, .right-panel {
        width: 32px;
      }

      .top-bar-inner {
        padding: 0.6rem 0.8rem;
      }

      .nav-container {
        gap: 1rem;
      }

      .logo {
        height: 36px;
      }

      .mobile-menu-btn {
        right: 0.8rem;
        font-size: 1.5rem;
      }

      .mobile-nav {
        top: 56px;
        min-width: 160px;
        padding: 1rem;
      }

      .mobile-nav a {
        font-size: 0.9rem;
      }

      .ticker-content-header {
        font-size: 0.65rem;
      }

      .news-badge-ticker {
        font-size: 0.5rem;
        padding: 0.1rem 0.3rem;
      }

      .page-title {
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
      }

      .contact-btn {
        font-size: 1.2rem;
        padding: 12px 0;
      }

      .btn-caption {
        font-size: 0.7rem;
      }

      .content-inner {
        padding: 1.5rem 0.8rem 0 0.8rem;
      }

      .footer {
        padding: 0.8rem 1rem;
      }

      .footer-top {
        flex-direction: column;
        gap: 1rem;
      }

      .footer-logo {
        height: 25px;
      }

      .footer-socials {
        gap: 1rem;
      }

      .footer-social-link {
        font-size: 0.7rem;
      }

      .footer-copyright {
        font-size: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="left-panel"></div>

  <div class="main-content">
    <div class="top-bar">
      <div class="top-bar-inner">
        <div class="nav-container">
          <div class="logo-wrapper">
            <a href="index.html">
              <img src="Images/logo.png" alt="CallbyBreath" class="logo">
            </a>
            <div class="tooltip"><span class="scale-wrapper">TAKE A LITTLE CITRUS FROM MY HANDS 🍋 ♡(｡- ω -)</span></div>
          </div>
          
          <nav class="nav">
            <a href="discography.html"><span class="scale-wrapper">DISCOGRAPHY</span></a>
            <span class="nav-separator">|</span>
            <a href="videos.html"><span class="scale-wrapper">MUSIC VIDEOS</span></a>
            <span class="nav-separator">|</span>
            <a href="archive.html"><span class="scale-wrapper">ARCHIVE</span></a>
            <span class="nav-separator">|</span>
            <a href="news.html"><span class="scale-wrapper">NEWS</span></a>
            <span class="nav-separator">|</span>
            <a href="special.html"><span class="scale-wrapper">SPECIAL</span></a>
            <span class="nav-separator">|</span>
            <a href="contacts.html" class="active"><span class="scale-wrapper">SOCIAL</span></a>
          </nav>
        </div>

        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
      </div>
    </div>

    <a href="news.html" class="news-ticker-header">
      <div class="ticker-content-header" id="tickerHeader"></div>
    </a>

    <nav class="mobile-nav" id="mobileNav">
      <a href="discography.html"><span class="scale-wrapper">DISCOGRAPHY</span></a>
      <a href="videos.html"><span class="scale-wrapper">MUSIC VIDEOS</span></a>
      <a href="archive.html"><span class="scale-wrapper">ARCHIVE</span></a>
      <a href="news.html"><span class="scale-wrapper">NEWS</span></a>
      <a href="special.html"><span class="scale-wrapper">SPECIAL</span></a>
      <a href="contacts.html" class="active"><span class="scale-wrapper">SOCIAL</span></a>
    </nav>

    <div class="page-wrapper">
      <div class="content-inner">
        <h1 class="page-title">
          <span class="scale-wrapper">CHECK OUT OUR SOCIAL MEDIA!</span>
        </h1>
        
        <div class="contacts-container" id="contactsContainer"></div>
      </div>

      <div class="footer">
        <div class="footer-content">
          <div class="footer-top">
            <img src="Images/logo.png" alt="CallbyBreath" class="footer-logo">
            <div class="footer-socials" id="footerSocials"></div>
          </div>
          <div class="footer-copyright">
            <span class="scale-wrapper">© ALL RIGHTS RESERVED</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="right-panel"></div>

  <script>
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileNav = document.getElementById('mobileNav');

    mobileMenuBtn.addEventListener('click', () => {
      mobileNav.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!mobileNav.contains(e.target) && !mobileMenuBtn.contains(e.target)) {
        mobileNav.classList.remove('active');
      }
    });

    const tickerNews = [
      { date: "2025.04.15", title: "CALLBYBREATH IS NOW AVAILABLE ON INSTAGRAM, PINTEREST, DISCORD, TELEGRAM, VK!", isLatest: true },
      { date: "2025.04.15", title: "CALLBYBREATH OFFICIAL WEBSITE OUT NOW! NEW DESIGN!", isLatest: false }
    ];

    function renderTicker() {
      const ticker = document.getElementById('tickerHeader');
      
      let contentHTML = '';
      tickerNews.forEach(news => {
        contentHTML += `<span>${news.date}  `;
        if (news.isLatest) {
          contentHTML += `<span class="news-badge-ticker">LATEST NEWS</span>  `;
        }
        contentHTML += `${news.title}  ◆  </span>`;
      });
      
      ticker.innerHTML = contentHTML + contentHTML;
    }

    renderTicker();

    const footerSocialLinks = [
      { name: 'youtube', url: 'https://www.youtube.com/@CallbyBreath' },
      { name: 'instagram', url: 'https://www.instagram.com/callbybreath.official' },
      { name: 'pinterest', url: 'https://pinterest.com/callbybreath' },
      { name: 'telegram', url: 'https://t.me/callbybreath' },
      { name: 'spotify', url: 'https://open.spotify.com/artist/4RJTPseEgwmAZIto7YDuV6' },
      { name: 'apple music', url: 'https://music.apple.com/ru/artist/callbybreath/1602956679' }
    ];

    function renderFooterSocials() {
      const container = document.getElementById('footerSocials');
      container.innerHTML = '';
      
      footerSocialLinks.forEach(link => {
        const a = document.createElement('a');
        a.className = 'footer-social-link';
        a.href = link.url;
        a.target = '_blank';
        a.innerHTML = `<span class="scale-wrapper">${link.name}</span>`;
        container.appendChild(a);
      });
    }

    renderFooterSocials();

    const socialLinks = [
      {
        name: 'YOUTUBE',
        url: 'https://www.youtube.com/@CallbyBreath',
        since: 'SINCE 2020.06.25'
      },
      
      {
        name: 'INSTAGRAM',
        url: 'https://www.instagram.com/callbybreath.official',
        since: 'SINCE 2020.04.08'
      },
      
      {
        name: 'PINTEREST',
        url: 'https://pinterest.com/callbybreath',
        since: 'SINCE 2023.08.20'
      },
      
      {
        name: 'TELEGRAM',
        url: 'https://t.me/CallbyBreath',
        since: 'SINCE 2024.11.28'
      }
      
    ];
    
    function renderSocialLinks() {
      const container = document.getElementById('contactsContainer');
      container.innerHTML = '';
      
      socialLinks.forEach(link => {
        const btnWrapper = document.createElement('div');
        btnWrapper.className = 'btn-wrapper';
        
        const btn = document.createElement('a');
        btn.className = 'contact-btn';
        btn.href = link.url;
        btn.target = '_blank';
        
        const btnSpan = document.createElement('span');
        btnSpan.className = 'scale-wrapper';
        btnSpan.textContent = link.name;
        btn.appendChild(btnSpan);
        
        const caption = document.createElement('span');
        caption.className = 'btn-caption';
        
        const captionSpan = document.createElement('span');
        captionSpan.className = 'scale-wrapper';
        captionSpan.textContent = link.since;
        caption.appendChild(captionSpan);
        
        btnWrapper.appendChild(btn);
        btnWrapper.appendChild(caption);
        
        container.appendChild(btnWrapper);
      });
    }
    
    renderSocialLinks();

    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });

    document.addEventListener('copy', (e) => {
      e.preventDefault();
      return false;
    });

    document.addEventListener('cut', (e) => {
      e.preventDefault();
      return false;
    });

    document.addEventListener('dragstart', (e) => {
      e.preventDefault();
      return false;
    });
  </script>
</body>
</html>
